  }
  setCrumbs(existing ? [{ t:'World', h:'world' }, { t:existing.title, h:'trip-' + existing.id }, { t:'Edit' }] : [{ t:'World', h:'world' }, { t:'New trip' }]);
  const T = existing ? JSON.parse(JSON.stringify(existing)) : { id:uid(), title:'', startDate:'', endDate:'', notes:'', friends:[], destinations:[], photos:[], createdAt:Date.now() };
  if (!existing && prefill){ T.destinations = [prefill]; prefill = null; }
  const pending = []; // new photo files {file, url, caption}
  const removed = [];
  formDirty = false;
  stage.innerHTML = `<div class="page" style="max-width:860px">
    <div class="pagehead"><h1>${existing ? 'Edit trip' : 'Add a trip'}</h1></div>
    <form class="form" id="tripForm" novalidate>
      <div class="field"><label for="fTitle">Trip title</label><input type="text" id="fTitle" required maxlength="120" placeholder="e.g. Austria by train" value="${esc(T.title)}"></div>
      <div class="field"><div class="lbl" id="ownLbl">Who went? <span class="hint">— tap both if you went together</span></div>
        <div class="opick" id="ownerPick" role="group" aria-labelledby="ownLbl"></div></div>
      <div class="row2">
        <div class="field"><label for="fStart">Start date</label><input type="date" id="fStart" value="${esc(T.startDate)}"></div>
        <div class="field"><label for="fEnd">End date</label><input type="date" id="fEnd" value="${esc(T.endDate)}"></div>
      </div>
      <div class="field"><div class="lbl">Locations <span class="hint">— add one or more stops, in order</span></div>
        <div class="dests" id="dests"></div>
        <button type="button" class="btn sm" id="addDest">＋ Add a location</button></div>
      <div class="field"><label for="fFriendIn">Friends <span class="hint">— who came along · press Enter after each name</span></label>
        <div class="friendbox" id="friendBox"><input id="fFriendIn" type="text" placeholder="Who came along?" autocomplete="off"></div></div>
      <div class="field"><label for="fNotes">Notes</label><textarea id="fNotes" placeholder="Highlights, places you ate, things to remember…">${esc(T.notes)}</textarea></div>
      <div class="field"><div class="lbl">Pictures <span class="hint">— the first one is the cover</span></div>
        <label class="drop" id="drop"><input type="file" id="fFiles" accept="image/*" multiple class="sr-only"><b>Choose pictures</b> or drop them here</label>
        <div class="photos" id="photos"></div></div>
      <div class="formactions">
        <button type="submit" class="btn primary" id="saveBtn">${existing ? 'Save changes' : 'Save trip'}</button>
        <a class="btn ghost" href="#${existing ? 'trip-' + T.id : 'world'}">Cancel</a>
        <span class="spacer"></span>
        ${existing ? '<button type="button" class="btn danger" id="delBtn">Delete trip</button>' : ''}
      </div>
      <div class="err" id="err" role="alert"></div><div class="progress" id="prog" aria-live="polite"></div>
    </form></div>`;
  const form = $('#tripForm', stage);
  form.addEventListener('input', () => formDirty = true);
  // destinations
  const drawDests = () => {
    $('#dests', stage).innerHTML = T.destinations.map((d, i) => `<div class="dest"><span class="num">${i+1}</span>
      <div class="grow"><div class="n">${esc(d.name)}</div><div class="w">${esc([d.stateName, d.countryName].filter(Boolean).join(', ') || 'Unknown place')}</div></div>
      ${i > 0 ? `<button type="button" class="btn sm ghost" data-up="${i}" aria-label="Move ${esc(d.name)} up">↑</button>` : ''}
      <button type="button" class="btn sm" data-edit="${i}">Change</button>
      <button type="button" class="btn sm ghost" data-del="${i}" aria-label="Remove ${esc(d.name)}">✕</button></div>`).join('');
  };
  $('#dests', stage).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.del != null){ T.destinations.splice(+b.dataset.del, 1); formDirty = true; drawDests(); }
    if (b.dataset.up != null){ const k = +b.dataset.up; [T.destinations[k-1], T.destinations[k]] = [T.destinations[k], T.destinations[k-1]]; formDirty = true; drawDests(); }
    if (b.dataset.edit != null){ const k = +b.dataset.edit; openPicker(T.destinations[k], d => { T.destinations[k] = d; formDirty = true; drawDests(); }); }
  });
  $('#addDest', stage).addEventListener('click', () => openPicker(T.destinations[T.destinations.length - 1] ? { near:T.destinations[T.destinations.length - 1] } : null, d => { T.destinations.push(d); formDirty = true; drawDests(); }));
  drawDests();
  // friends
  const fIn = $('#fFriendIn', stage), fBox = $('#friendBox', stage);
  const drawFriends = () => {
    fBox.querySelectorAll('.chip').forEach(c => c.remove());
    T.friends.forEach((f, i) => { const c = document.createElement('span'); c.className = 'chip'; c.innerHTML = `${esc(f)}<button type="button" aria-label="Remove ${esc(f)}">×</button>`; c.querySelector('button').onclick = () => { T.friends.splice(i, 1); drawFriends(); }; fBox.insertBefore(c, fIn); });
  };
  const addFriend = () => { const v = fIn.value.replace(/,/g, '').trim(); if (v && !T.friends.includes(v)) T.friends.push(v); fIn.value = ''; drawFriends(); };
  fIn.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ','){ e.preventDefault(); addFriend(); } else if (e.key === 'Backspace' && !fIn.value && T.friends.length){ T.friends.pop(); drawFriends(); } });
  fIn.addEventListener('blur', addFriend);
  fBox.addEventListener('click', e => { if (e.target === fBox) fIn.focus(); });
  drawFriends();
  // who went (Tommy / Katherine / both)
  let lastOwners = []; try { lastOwners = JSON.parse(lsGet('tripatlas.lastOwners') || '[]'); } catch(e){}
  const selOwners = existing ? Owners.of(T) : PEOPLE.filter(p => lastOwners.includes(p));
  const drawOwners = () => {
    $('#ownerPick', stage).innerHTML = PEOPLE.map(n => `<button type="button" class="ochip big" style="--c:${Owners.color(n)}" aria-pressed="${selOwners.includes(n)}" data-pick="${esc(n)}"><i></i>${esc(n)}</button>`).join('') +
      `<span class="pickhint" style="--c:${HUES[Owners.hueKey(new Set(selOwners))].pin}">${selOwners.length === 2 ? 'Shows in blue — you both went' : selOwners.length ? `Shows in ${selOwners[0] === PEOPLE[0] ? 'purple' : 'green'}` : ''}</span>`;
  };
  $('#ownerPick', stage).addEventListener('click', e => {
    const b = e.target.closest('[data-pick]'); if (!b) return;
    const n = b.dataset.pick, k = selOwners.indexOf(n);
    k >= 0 ? selOwners.splice(k, 1) : selOwners.push(n);
    formDirty = true; drawOwners();
  });
  drawOwners();
  // photos
  const drawPhotos = () => {
    const all = [...T.photos.map((p, i) => ({ kind:'old', p, i })), ...pending.map((p, i) => ({ kind:'new', p, i }))];
    const el = $('#photos', stage);
    el.innerHTML = all.map((x, k) => `<div class="ph">${k === 0 ? '<span class="cover">Cover</span>' : ''}<img alt=""><div class="tools">
      ${k > 0 ? `<button type="button" data-cover="${k}" aria-label="Make cover" title="Make cover">★</button>` : ''}
      <button type="button" data-rm="${k}" aria-label="Remove picture" title="Remove">✕</button></div>
      <input type="text" data-cap="${k}" placeholder="Caption" value="${esc(x.p.caption || '')}" aria-label="Caption for picture ${k+1}"></div>`).join('');
    el.querySelectorAll('img').forEach((img, k) => { const x = all[k]; if (x.kind === 'new') img.src = x.p.url; else setPhoto(img, x.p); });
    el.querySelectorAll('input[data-cap]').forEach(inp => inp.addEventListener('input', () => { const x = all[+inp.dataset.cap]; x.p.caption = inp.value; }));
    el.querySelectorAll('button[data-rm]').forEach(b => b.onclick = () => { const x = all[+b.dataset.rm]; if (x.kind === 'old'){ removed.push(T.photos[x.i]); T.photos.splice(x.i, 1); } else { URL.revokeObjectURL(x.p.url); pending.splice(x.i, 1); } formDirty = true; drawPhotos(); });
    el.querySelectorAll('button[data-cover]').forEach(b => b.onclick = () => {
      const x = all[+b.dataset.cover];
      if (x.kind === 'old'){ const [p] = T.photos.splice(x.i, 1); T.photos.unshift(p); }
      else { const [p] = pending.splice(x.i, 1); pending.unshift(p); p.cover = true; pending.forEach(q => { if (q !== p) q.cover = false; }); }
      formDirty = true; drawPhotos();
    });
  };
  const addFiles = (files) => { for (const f of files){ if (!f.type.startsWith('image/') && !/\.(heic|heif)$/i.test(f.name)) continue; pending.push({ file:f, url:URL.createObjectURL(f), caption:'' }); } formDirty = true; drawPhotos(); };
  $('#fFiles', stage).addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });
  const drop = $('#drop', stage);
  ['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => addFiles(e.dataTransfer.files));
  drawPhotos();
  cleanup.push(() => pending.forEach(p => URL.revokeObjectURL(p.url)));
  // save
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const err = $('#err', stage), prog = $('#prog', stage), btn = $('#saveBtn', stage);
    err.textContent = '';
    addFriend();
    T.title = $('#fTitle', stage).value.trim();
    T.startDate = $('#fStart', stage).value; T.endDate = $('#fEnd', stage).value;
    T.notes = $('#fNotes', stage).value.trim();
    if (!T.title){ err.textContent = 'Give the trip a title.'; $('#fTitle', stage).focus(); return; }
    if (!selOwners.length){ err.textContent = `Pick who went: ${PEOPLE.join(', ')}, or both.`; $('#ownerPick button', stage).focus(); return; }
    T.owners = PEOPLE.filter(p => selOwners.includes(p));
    if (!T.destinations.length){ err.textContent = 'Add at least one location so the trip shows up on the map.'; $('#addDest', stage).focus(); return; }
    if (T.startDate && T.endDate && T.endDate < T.startDate){ err.textContent = 'The end date is before the start date.'; $('#fEnd', stage).focus(); return; }
    btn.disabled = true;
    try {
      const uploaded = [];
      for (let k = 0; k < pending.length; k++){
        prog.textContent = `Uploading picture ${k+1} of ${pending.length}…`;
        const r = await Store.uploadPhoto(pending[k].file);
        uploaded.push({ ...r, caption:pending[k].caption || '', cover:pending[k].cover });
      }
      const coverNew = uploaded.findIndex(u => u.cover);
      uploaded.forEach(u => delete u.cover);
      if (coverNew >= 0){ const [c] = uploaded.splice(coverNew, 1); T.photos = [c, ...T.photos, ...uploaded]; }
      else T.photos = [...T.photos, ...uploaded];
      prog.textContent = 'Saving…';
      await Store.save(T);
      for (const p of removed) await Store.deletePhoto(p);
      formDirty = false;
      pending.length = 0;
      lsSet('tripatlas.lastOwners', JSON.stringify(T.owners));
      toast(existing ? 'Trip updated' : 'Trip saved');
      go('trip-' + T.id);
    } catch(ex){
      btn.disabled = false; prog.textContent = '';
      err.textContent = ex && (ex.name === 'QuotaExceededError' || /quota|full/i.test(ex.message || '')) ? 'This browser is out of storage space. Remove some pictures or trips and try again.' : (ex && ex.message) ? 'Could not save: ' + ex.message : 'Could not save. Try again.';
    }
  });
  const del = $('#delBtn', stage);
  if (del) del.addEventListener('click', () => confirmBox(`Delete “${existing.title}”?`, 'This removes the trip and its pictures from this browser. It can’t be undone unless you have a backup.', 'Delete trip', async () => {
    try { await Store.remove(T.id); for (const p of existing.photos || []) await Store.deletePhoto(p); formDirty = false; toast('Trip deleted'); go('world'); }
    catch(e){ toast('Could not delete the trip'); }
  }));
  $('#fTitle', stage).focus({ preventScroll:true });
}
function confirmBox(title, body, okLabel, onOk){
  const m = document.createElement('div'); m.className = 'modal confirm'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true');
  m.innerHTML = `<div class="box"><h2>${esc(title)}</h2><p class="sub">${esc(body)}</p><div class="formactions" style="justify-content:flex-end"><button class="btn" data-x>Cancel</button><button class="btn primary" style="background:var(--danger);border-color:var(--danger)" data-ok>${esc(okLabel)}</button></div></div>`;
  document.body.appendChild(m);
  const close = () => m.remove();
  m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-x]')) close(); });
  $('[data-ok]', m).addEventListener('click', () => { close(); onOk(); });
  $('[data-x]', m).focus();
  m.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
}

/* ---------- location picker ---------- */
function openPicker(current, onDone){
  const near = current && current.near;
  if (near) current = null;
  let sel = current ? { ...current } : null;
  const m = document.createElement('div'); m.className = 'modal'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true'); m.setAttribute('aria-labelledby', 'pkTitle');
  m.innerHTML = `<div class="box">
    <div class="mh"><h2 id="pkTitle">${current ? 'Change location' : 'Add a location'}</h2><button class="btn iconbtn ghost" data-x aria-label="Close">✕</button></div>
    <div class="picker">
      <div class="side">
        <div class="search" style="margin:0">${ICON.search}<label class="sr-only" for="pkQ">Search a city, country or US state</label><input id="pkQ" type="search" placeholder="Search a city, country or state…" autocomplete="off"></div>
        <ul class="results" id="pkRes"></ul>
        <p class="sub" style="margin:0">Or tap the map to drop a pin anywhere — a park, a beach, a trailhead.</p>
        <div class="field"><label for="pkName">Name this stop</label><input type="text" id="pkName" placeholder="e.g. Zion National Park" maxlength="80"></div>
        <div class="picked" id="pkInfo">No location picked yet.</div>
      </div>
      <div class="mapwrap" id="pkMap"></div>
    </div>
    <div class="mf"><button class="btn" data-x>Cancel</button><button class="btn primary" id="pkOk" disabled>${current ? 'Update location' : 'Add location'}</button></div>
  </div>`;
  document.body.appendChild(m);
  const prevFocus = document.activeElement;
  const close = () => { m.remove(); document.removeEventListener('keydown', onEsc); if (prevFocus) prevFocus.focus({ preventScroll:true }); };
  const onEsc = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onEsc);
  m.querySelectorAll('[data-x]').forEach(b => b.onclick = close);
  const nameIn = $('#pkName', m), info = $('#pkInfo', m), ok = $('#pkOk', m), q = $('#pkQ', m), res = $('#pkRes', m);
  if (sel) nameIn.value = sel.name;
  let nameTouched = !!current;
  nameIn.addEventListener('input', () => { nameTouched = true; refresh(); });

  // map
  const wrap = $('#pkMap', m);
  const W = wrap.clientWidth, H = wrap.clientHeight;
  const proj = d3.geoMercator().fitExtent([[10, 10], [W - 10, H - 10]], { type:'MultiPoint', coordinates:[[-170, -56], [190, 74]] }).rotate([-10, 0]);
  proj.fitExtent([[10, 10], [W - 10, H - 10]], { type:'MultiPoint', coordinates:[[-170, -56], [190, 74]] });
  const path = d3.geoPath(proj);
  const svg = d3.select(wrap).append('svg').attr('viewBox', `0 0 ${W} ${H}`).attr('aria-label', 'Map — tap to place a pin');
  const g = svg.append('g');
  const cPaths = g.append('g').selectAll('path').data(G.countries).join('path').attr('d', path).attr('class', 'country');
  const sPaths = g.append('g').selectAll('path').data(G.states).join('path').attr('d', path).attr('class', 'state').style('pointer-events', 'none');
  const pin = g.append('g').attr('class', 'pin').attr('display', 'none'); pin.append('circle').attr('r', 8);
  let k = 1;
  const zoom = d3.zoom().scaleExtent([1, 200]).clickDistance(6).translateExtent([[-W*0.2, -H*0.2], [W*1.2, H*1.2]])
    .on('zoom', ev => { k = ev.transform.k; g.attr('transform', ev.transform); placePin(); });
  svg.call(zoom).on('dblclick.zoom', null);
  const ctl = d3.select(wrap).append('div').attr('class', 'mapctl');
  ctl.append('button').attr('class', 'btn iconbtn').attr('type', 'button').attr('aria-label', 'Zoom in').text('+').on('click', () => svg.transition().duration(250).call(zoom.scaleBy, 2));
  ctl.append('button').attr('class', 'btn iconbtn').attr('type', 'button').attr('aria-label', 'Zoom out').text('−').on('click', () => svg.transition().duration(250).call(zoom.scaleBy, 0.5));
  function placePin(){
    if (!sel){ pin.attr('display', 'none'); return; }
    const xy = proj([sel.lon, sel.lat]); pin.attr('display', null).attr('transform', `translate(${xy}) scale(${1/k})`);
  }
  function flyTo(geo, maxK = 60){
    const [[x0, y0], [x1, y1]] = path.bounds(geo);
    const kk = Math.max(1, Math.min(maxK, 0.8 / Math.max((x1 - x0) / W, (y1 - y0) / H)));
    const t = d3.zoomIdentity.translate(W/2, H/2).scale(kk).translate(-(x0 + x1)/2, -(y0 + y1)/2);
    svg.transition().duration(reduceMotion ? 0 : 600).call(zoom.transform, t);
  }
  function setPoint(lon, lat, name, zoomTo){
    const l = locate(lon, lat);
    sel = { id:(sel && sel.id) || uid('d'), name:'', lon:+lon.toFixed(4), lat:+lat.toFixed(4), country:l.country?.key || null, countryName:l.country?.name || '', state:l.state?.id || null, stateName:l.state?.name || '' };
    if (name && !nameTouched) nameIn.value = name;
    if (!name && !nameTouched) nameIn.value = '';
    placePin(); refresh();
    if (zoomTo) flyTo({ type:'Feature', geometry:{ type:'Point', coordinates:[lon, lat] } }, zoomTo);
  }
  function refresh(){
    cPaths.classed('focus', f => sel && f.key === sel.country);
    if (!sel){ info.textContent = 'No location picked yet.'; ok.disabled = true; return; }
    const where = [sel.stateName, sel.countryName].filter(Boolean).join(', ');
    info.innerHTML = where ? `📍 In <b>${esc(where)}</b>` : '📍 This spot isn’t inside a country — try tapping closer to land.';
    ok.disabled = !where || !nameIn.value.trim();
    if (where && !nameIn.value.trim()) info.innerHTML += '<br>Give this stop a name to add it.';
  }
  svg.on('click', ev => {
    const [x, y] = d3.zoomTransform(svg.node()).invert(d3.pointer(ev, svg.node()));
    const ll = proj.invert([x, y]); if (!ll) return;
    nameTouched = nameTouched && !!nameIn.value.trim();
    setPoint(ll[0], ll[1], null);
    if (!nameIn.value.trim()) nameIn.focus();
  });
  // search: cities, countries, states
  let cities = null; loadCities().then(c => { cities = c; if (q.value) search(); }).catch(() => {});
  const search = () => {
    const term = slug(q.value);
    if (!term){ res.innerHTML = ''; return; }
    const out = [];
    for (const f of G.countries) if (slug(f.name).startsWith(term)) out.push({ kind:'country', label:f.name, sub:'Country', f });
    for (const s of G.states) if (slug(s.name).startsWith(term)) out.push({ kind:'state', label:s.name, sub:'US state', f:s });
    if (cities){
      let n = 0;
      for (const c of cities){ if (c.s.startsWith(term)){ out.push({ kind:'city', label:c.n, sub:[c.cc === 'US' ? US_POSTAL[c.adm] : '', G.meta.countryNameByA2[c.cc] || c.cc].filter(Boolean).join(', '), c }); if (++n > 12) break; } }
    } else out.push({ kind:'wait', label:'Loading cities…', sub:'' });
    res.innerHTML = out.slice(0, 16).map((o, i) => `<li><button type="button" data-i="${i}" ${o.kind === 'wait' ? 'disabled' : ''}>${esc(o.label)}<small>${esc(o.sub)}</small></button></li>`).join('') || '<li class="sub" style="padding:8px">No matches. Tap the map instead.</li>';
    res.querySelectorAll('button[data-i]').forEach(b => b.onclick = () => {
      const o = out[+b.dataset.i];
      res.querySelectorAll('button').forEach(x => x.classList.remove('sel')); b.classList.add('sel');
      if (o.kind === 'city'){ nameTouched = false; setPoint(o.c.lon, o.c.lat, o.c.n, 40); }
      else {
        // zoom to the region; user taps the map to place a specific pin, or we use its centre
        flyTo(o.kind === 'country' ? mainGeometry(o.f) : o.f, 40);
        const c = d3.geoCentroid(o.kind === 'country' ? mainGeometry(o.f) : o.f);
        nameTouched = false; setPoint(c[0], c[1], o.label);
        info.innerHTML += '<br><span class="sub">Tap the map to move the pin to an exact spot.</span>';
      }
    });
  };
  q.addEventListener('input', debounce(search, 100));
  q.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); const b = res.querySelector('button[data-i]'); if (b) b.click(); } });
  ok.onclick = () => { if (!sel) return; sel.name = nameIn.value.trim(); onDone(sel); close(); };
  // starting view
  if (sel){ placePin(); refresh(); flyTo({ type:'Feature', geometry:{ type:'Point', coordinates:[sel.lon, sel.lat] } }, 30); }
  else if (near){ const f = G.byKey.get(near.country); if (f) flyTo(mainGeometry(f), 20); }
  setTimeout(() => q.focus(), 30);
}

/* ---------- backup & restore ---------- */
function openBackup(){
  const m = document.createElement('div'); m.className = 'modal'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true'); m.setAttribute('aria-labelledby', 'bkTitle');
  const last = +(lsGet('tripatlas.lastBackup') || 0);
  m.innerHTML = `<div class="box" style="max-width:520px;height:auto">
    <div class="mh"><h2 id="bkTitle">Backup &amp; restore</h2><button class="btn iconbtn ghost" data-x aria-label="Close">✕</button></div>
    <div style="padding:18px;display:flex;flex-direction:column;gap:16px;overflow:auto">
      <p style="margin:0">Your trips and pictures are stored only in this browser on this device. Download a backup now and then, and use it to move your atlas to another device or browser.</p>
      <div><button class="btn primary" id="bkExport">Download backup</button>
        <div class="sub" style="margin-top:6px" id="bkInfo">${Store.trips.length} trip${Store.trips.length === 1 ? '' : 's'} · last backup: ${last ? new Date(last).toLocaleDateString() : 'never'}</div></div>
      <div><label class="btn" for="bkFile" style="display:inline-flex">Restore from a backup…</label><input type="file" id="bkFile" accept="application/json,.json" class="sr-only">
        <div class="sub" style="margin-top:6px">Restoring adds the backup’s trips to this browser. Trips with the same ID get replaced.</div></div>
      <div class="sub" id="bkUsage"></div>
      <div class="sub" style="border-top:1px solid var(--line);padding-top:12px;font-size:12px">Map data: Natural Earth (public domain) via world-atlas and us-atlas. City search: GeoNames (CC BY 4.0). Maps drawn with D3.</div>
    </div></div>`;
  document.body.appendChild(m);
  const close = () => { m.remove(); document.removeEventListener('keydown', onEsc); };
  const onEsc = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onEsc);
  m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-x]')) close(); });
  if (navigator.storage && navigator.storage.estimate) navigator.storage.estimate().then(est => {
    const mb = (n) => (n / 1048576).toFixed(n > 1048576 * 100 ? 0 : 1) + ' MB';
    $('#bkUsage', m).textContent = `Using ${mb(est.usage || 0)} of about ${mb(est.quota || 0)} available in this browser.`;
  }).catch(() => {});
  $('#bkExport', m).addEventListener('click', async (e) => {
    const b = e.currentTarget; b.disabled = true; b.textContent = 'Preparing…';
    try {
      const data = await Store.exportAll();
      const blob = new Blob([JSON.stringify(data)], { type:'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = `trip-atlas-backup-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      lsSet('tripatlas.lastBackup', String(Date.now()));
      $('#bkInfo', m).textContent = `${Store.trips.length} trip${Store.trips.length === 1 ? '' : 's'} · last backup: today`;
      toast('Backup downloaded');
    } catch(ex){ toast('Could not make the backup'); }
    b.disabled = false; b.textContent = 'Download backup';
  });
  $('#bkFile', m).addEventListener('change', async (e) => {
    const f = e.target.files[0]; if (!f) return;
    const lbl = m.querySelector('label[for=bkFile]'); lbl.textContent = 'Restoring…';
    try { const n = await Store.importAll(JSON.parse(await f.text())); lsSet('tripatlas.lastBackup', String(Date.now())); toast(`Restored ${n} trip${n === 1 ? '' : 's'}`); close(); render(true); }
    catch(ex){ toast(ex && ex.message && ex.message.includes('Trip Atlas') ? ex.message : 'Could not read that backup file'); }
    lbl.textContent = 'Restore from a backup…'; e.target.value = '';
  });
  $('#bkExport', m).focus();
}
$('#backupBtn').addEventListener('click', openBackup);
document.addEventListener('click', e => { const a = e.target.closest('[data-backup]'); if (a){ e.preventDefault(); openBackup(); } });

/* ================= boot ================= */
$('#brand').addEventListener('click', () => go('world'));
window.addEventListener('hashchange', () => {
  if (formDirty && !confirmLeave()) return;
  formDirty = false; render(true);
});
let lastHash = location.hash;
function confirmLeave(){
  // A route change away from an unsaved form: bounce back and ask.
  const target = location.hash;
  history.replaceState(null, '', lastHash || '#world');
  confirmBox('Leave without saving?', 'Your changes to this trip will be lost.', 'Leave', () => { formDirty = false; location.hash = target; });
  return false;
}
window.addEventListener('hashchange', () => { lastHash = location.hash; });
let lastW = innerWidth, lastH = innerHeight;
window.addEventListener('resize', debounce(() => {
  if (Math.abs(innerWidth - lastW) < 2 && Math.abs(innerHeight - lastH) < 120) return; // ignore mobile URL-bar jiggle
  lastW = innerWidth; lastH = innerHeight;
  const v = parseRoute().view; if (v !== 'form' && v !== 'trip') render(true);
}, 200));
Store.listeners.add(() => { if (G.ready) { reindex(); render(); } });
render(true);
loadGeo().then(() => { reindex(); render(true); }).catch(e => { $('#stage').innerHTML = location.protocol === 'file:' ? '<div class="loading" style="padding:20px;text-align:center">Trip Atlas needs to be served from a web address, not opened as a file.<br>See the README for how to run it locally or on GitHub Pages.</div>' : '<div class="loading">The map couldn’t load. Refresh to try again.</div>'; console.error(e); });
Store.init();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
})();
</script>
</body>
</html>
