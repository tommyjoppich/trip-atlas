/* ================= WORLD VIEW (globe) ================= */
let globeRot = [-10, -25, 0], globeK = 1;
function viewWorld(panel, stage){
  setCrumbs([{ t:'World' }]);
  stage.classList.add('globe-bg');
  stage.setAttribute('aria-label', 'Globe of visited countries');
  // ---- left panel: recent trips + search
  panel.innerHTML = `${statusBanner()}<h2>Recent trips</h2><p class="sub">Search and pick a trip, or spin the globe and tap a continent.</p>
    <div class="search">${ICON.search}<label class="sr-only" for="q">Search trips</label><input id="q" type="search" placeholder="Search trips, places, people…" autocomplete="off"></div>
    <div id="listWrap"></div>
    <h3>Continents</h3><div class="chips" id="contChips"></div>`;
  const q = $('#q', panel);
  q.value = viewWorld.q || '';
  const drawList = () => {
    viewWorld.q = q.value;
    const term = slug(q.value);
    const all = sortTrips(IDX.trips);
    const list = term ? all.filter(t => slug([t.title, t.notes, (t.friends||[]).join(' '), Owners.of(t).join(' '), (t.destinations||[]).map(d => [d.name, d.countryName, d.stateName].join(' ')).join(' ')].join(' ')).includes(term)) : all;
    const wrap = $('#listWrap', panel);
    if (!Store.trips.length){ wrap.innerHTML = Store.loaded ? emptyState() : '<p class="sub">Loading trips…</p>'; wireSample(panel); return; }
    if (!all.length){ wrap.innerHTML = `<div class="empty">No trips for who you picked.<br><button class="btn sm" data-showall>Show everyone</button></div>`; return; }
    if (!list.length){ wrap.innerHTML = `<div class="empty">No trips match “${esc(q.value)}”.</div>`; return; }
    wrap.innerHTML = `<ul class="triplist">${list.map(tripItemHTML).join('')}</ul>`;
    wireTripList($('ul', wrap), list, { enter:t => globe.focusTrip(t), leave:() => globe.focusTrip(null) });
  };
  q.addEventListener('input', debounce(drawList, 120));
  $('#contChips', panel).innerHTML = Object.entries(CONTINENTS).filter(([k]) => k !== 'antarctica').map(([k, c]) => {
    const n = tripsAt('k-' + k).length;
    return `<a class="chip ${n ? '' : 'off'}" href="#continent-${k}"><span class="dot" ${n ? `style="background:${paintPlace('k-' + k)}"` : ''}></span>${esc(c.name)}${n ? ` · ${n}` : ''}</a>`;
  }).join('');

  // ---- globe
  const globe = makeGlobe(stage);
  drawList();
}
/* The globe is drawn on a <canvas> (much faster than SVG on phones). While it's moving
   it uses lighter, lower-detail shapes; once it settles it redraws in full detail.
   Trip pins sit in a small SVG layer on top so they stay tappable. */
function makeGlobe(stage){
  const W = stage.clientWidth, H = stage.clientHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const base = Math.min(W, H) / 2 * 0.86;
  const proj = d3.geoOrthographic().translate([W/2, H/2]).scale(base * globeK).rotate(globeRot).clipAngle(90);
  const canvas = d3.select(stage).append('canvas')
    .attr('width', Math.round(W * dpr)).attr('height', Math.round(H * dpr))
    .style('width', W + 'px').style('height', H + 'px')
    .attr('role', 'img').attr('aria-label', 'Interactive globe of the places you have been. Use the continent buttons in the panel to explore with a keyboard.');
  const ctx = canvas.node().getContext('2d');
  const path = d3.geoPath(proj, ctx);
  const overlay = d3.select(stage).append('svg').attr('class', 'overlay').attr('viewBox', `0 0 ${W} ${H}`);
  const grat = d3.geoGraticule10();
  const SPHERE = { type:'Sphere' };

  // Pre-group the colored places once, for both detail levels.
  const groups = (countries, states) => {
    const m = new Map();
    const add = (f, c) => { if (!c) return; if (!m.has(c)) m.set(c, []); m.get(c).push(f); };
    for (const f of countries) if (f.key !== G.usKey) add(f, paintPlace(f.key, false));
    for (const s of states) add(s, paintPlace('s-' + s.id, false));
    return [...m];
  };
  const HI = { countries:G.countries, land:G.worldLand, mesh:G.worldMesh, states:G.states, statesMesh:G.lite ? G.lite.statesMesh : G.statesMesh };
  const LO = G.lite ? { countries:G.lite.countries, land:G.lite.land, mesh:G.lite.mesh, states:G.lite.states, statesMesh:G.lite.statesMesh } : HI;
  HI.fills = groups(HI.countries, HI.states);
  LO.fills = LO === HI ? HI.fills : groups(LO.countries, LO.states);
  const contOf = new Map(G.countries.map(f => [f.key, f.cont]));
  let hoverCont = null;

  const routes = IDX.trips.filter(t => (t.destinations||[]).length > 1)
    .map(t => ({ t, color:Owners.tripColor(t), geo:{ type:'LineString', coordinates:t.destinations.map(d => [d.lon, d.lat]) } }));
  let hotTrip = null;

  function draw(lo){
    // Full detail only when zoomed in and still; the lighter shapes look the same at globe scale.
    const S = (lo || proj.scale() < base * 2.2) ? LO : HI;
    proj.precision(lo ? 0 : 0.7);
    const [cx, cy] = proj.translate(), r = proj.scale();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    // ocean
    const grad = ctx.createRadialGradient(cx - r * 0.25, cy - r * 0.3, r * 0.05, cx, cy, r);
    grad.addColorStop(0, '#e6f0f1'); grad.addColorStop(1, '#bcd2d6');
    ctx.beginPath(); path(SPHERE); ctx.fillStyle = grad; ctx.fill();
    ctx.beginPath(); path(grat); ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 0.5; ctx.stroke();
    // land
    ctx.beginPath(); path(S.land); ctx.fillStyle = '#e8e0cf'; ctx.fill();
    // visited places (one fill call per color)
    for (const [color, feats] of S.fills){ ctx.beginPath(); for (const f of feats) path(f); ctx.fillStyle = color; ctx.fill(); }
    // hovered continent
    if (hoverCont){ ctx.beginPath(); for (const f of S.countries) if ((f.cont || contOf.get(f.key)) === hoverCont) path(f); ctx.fillStyle = 'rgba(30,42,47,.10)'; ctx.fill(); }
    // borders
    ctx.beginPath(); path(S.mesh); ctx.strokeStyle = '#b3a68d'; ctx.lineWidth = 0.6; ctx.stroke();
    ctx.beginPath(); path(S.statesMesh); ctx.strokeStyle = 'rgba(160,148,124,.7)'; ctx.lineWidth = 0.4; ctx.stroke();
    ctx.beginPath(); path(SPHERE); ctx.strokeStyle = '#a9bfc2'; ctx.lineWidth = 1; ctx.stroke();
    // routes
    ctx.setLineDash([5, 5]); ctx.globalAlpha = 0.85;
    for (const rt of routes){ ctx.beginPath(); path(rt.geo); ctx.strokeStyle = rt.color; ctx.lineWidth = rt.t === hotTrip ? 3.5 : 2; ctx.stroke(); }
    ctx.setLineDash([]); ctx.globalAlpha = 1;
    placePins();
  }

  // pins (SVG overlay)
  const dests = IDX.trips.flatMap(t => (t.destinations || []).map(d => ({ t, d })));
  const pins = overlay.selectAll('g').data(dests).join('g').attr('class', 'pin');
  pins.append('circle').attr('r', 5).style('fill', p => Owners.tripColor(p.t))
    .attr('tabindex', 0).attr('role', 'link').attr('aria-label', p => `${p.t.title}: ${p.d.name}`);
  function placePins(){
    const r = proj.rotate(), center = [-r[0], -r[1]];
    pins.attr('display', p => d3.geoDistance([p.d.lon, p.d.lat], center) < Math.PI/2 - 0.02 ? null : 'none')
        .attr('transform', p => `translate(${proj([p.d.lon, p.d.lat])})`);
  }

  // Redraw at most once per frame; low detail while moving, full detail ~150 ms after it stops.
  let raf = 0, lowNext = false, idleT = 0;
  function schedule(moving){
    lowNext = lowNext || moving;
    if (!raf) raf = requestAnimationFrame(() => { raf = 0; const lo = lowNext; lowNext = false; draw(lo); });
    clearTimeout(idleT);
    if (moving) idleT = setTimeout(() => schedule(false), 160);
  }
  draw(false);

  // what's under a point on the globe
  function countryAt(ev){
    const [x, y] = d3.pointer(ev, canvas.node());
    const ll = proj.invert([x, y]); if (!ll) return null;
    const r = proj.rotate();
    if (d3.geoDistance(ll, [-r[0], -r[1]]) > Math.PI/2) return null;
    return findIn(G.countries, ll[0], ll[1]);
  }
  const tip = d3.select(stage).append('div').attr('class', 'tip');
  const showTip = (ev, html) => { const [x, y] = d3.pointer(ev, stage); tip.html(html).style('left', x + 'px').style('top', y + 'px').classed('on', true); };
  let hoverRaf = 0;
  canvas.on('mousemove', ev => {
    if (hoverRaf) return;
    hoverRaf = requestAnimationFrame(() => {
      hoverRaf = 0;
      const f = countryAt(ev);
      canvas.style('cursor', f ? 'pointer' : 'grab');
      if (f) showTip(ev, `<b>${esc(CONTINENTS[f.cont].name)}</b> · ${esc(f.name)}`); else tip.classed('on', false);
      const c = f ? f.cont : null;
      if (c !== hoverCont){ hoverCont = c; schedule(false); }
    });
  }).on('mouseleave', () => { tip.classed('on', false); if (hoverCont){ hoverCont = null; schedule(false); } })
    .on('click', ev => { const f = countryAt(ev); if (f) go('continent-' + f.cont); });
  pins.on('mousemove', (ev, p) => showTip(ev, `<b>${esc(p.t.title)}</b> · ${esc(p.d.name)}`))
      .on('mouseleave', () => tip.classed('on', false))
      .on('click', (ev, p) => { ev.stopPropagation(); go('trip-' + p.t.id); })
      .on('keydown', (ev, p) => { if (ev.key === 'Enter') go('trip-' + p.t.id); });

  // drag to rotate, pinch/scroll to zoom
  let last = null, spinning = false, timer = null;
  const zoom = d3.zoom().scaleExtent([0.6, 8]).clickDistance(6)
    .on('start', () => { spinning = false; })
    .on('zoom', (ev) => {
      const t = ev.transform, se = ev.sourceEvent;
      globeK = t.k; proj.scale(base * t.k);
      const multi = se && se.touches && se.touches.length > 1;
      if (last && se && se.type !== 'wheel' && !multi){
        const s = 0.28 / t.k, r = proj.rotate();
        proj.rotate([r[0] + (t.x - last.x) * s, Math.max(-85, Math.min(85, r[1] - (t.y - last.y) * s)), r[2]]);
      }
      last = { x:t.x, y:t.y }; globeRot = proj.rotate();
      tip.classed('on', false);
      schedule(true);
    });
  canvas.call(zoom).call(zoom.transform, d3.zoomIdentity.scale(globeK));
  last = { x:0, y:0 };
  canvas.on('dblclick.zoom', null);
  spinning = !reduceMotion;
  if (spinning){
    let prev = 0;
    timer = d3.timer((el) => {
      if (!spinning){ timer.stop(); schedule(false); return; }
      const dt = el - prev; prev = el; const r = proj.rotate(); proj.rotate([r[0] + dt * 0.006, r[1], r[2]]); globeRot = proj.rotate(); schedule(true);
    });
  }
  // controls
  const ctl = d3.select(stage).append('div').attr('class', 'mapctl');
  ctl.append('button').attr('class', 'btn iconbtn').attr('aria-label', 'Zoom in').text('+').on('click', () => canvas.transition().duration(250).call(zoom.scaleBy, 1.5));
  ctl.append('button').attr('class', 'btn iconbtn').attr('aria-label', 'Zoom out').text('−').on('click', () => canvas.transition().duration(250).call(zoom.scaleBy, 1/1.5));
  addHeatLegend(stage);
  d3.select(stage).append('div').attr('class', 'maphint').text(matchMedia('(pointer:coarse)').matches ? 'Drag to spin · pinch to zoom · tap a continent' : 'Drag to spin · scroll to zoom · click a continent');

  // fly to a trip when it's hovered in the list
  let flyT = null;
  function focusTrip(t){
    hotTrip = t; pins.classed('hot', p => t && p.t === t);
    if (!t || !(t.destinations||[]).length){ schedule(false); return; }
    spinning = false;
    const target = d3.geoCentroid({ type:'MultiPoint', coordinates:t.destinations.map(d => [d.lon, d.lat]) });
    const from = proj.rotate(), to = [-target[0], -target[1], 0];
    const interp = d3.interpolate(from, to);
    if (flyT) flyT.stop();
    if (reduceMotion){ proj.rotate(to); globeRot = to; schedule(false); return; }
    flyT = d3.timer(el => { const k = Math.min(1, el / 650); proj.rotate(interp(d3.easeCubicOut(k))); globeRot = proj.rotate(); schedule(k < 1); if (k >= 1) flyT.stop(); });
  }
  cleanup.push(() => { if (timer) timer.stop(); if (flyT) flyT.stop(); cancelAnimationFrame(raf); cancelAnimationFrame(hoverRaf); clearTimeout(idleT); canvas.on('.zoom', null); });
  return { focusTrip };
}

/* ================= flat maps (continent + place) ================= */
function makeFlatMap(stage, proj, opts = {}){
  const W = stage.clientWidth, H = stage.clientHeight;
  const path = d3.geoPath(proj);
  const svg = d3.select(stage).append('svg').attr('viewBox', `0 0 ${W} ${H}`);
  const g = svg.append('g');
  const tip = d3.select(stage).append('div').attr('class', 'tip');
  const showTip = (ev, html) => { const [x, y] = d3.pointer(ev, stage); tip.html(html).style('left', x + 'px').style('top', y + 'px').classed('on', true); };
  const hideTip = () => tip.classed('on', false);
  let k = 1;
  const listeners = [];
  const zoom = d3.zoom().scaleExtent([1, opts.maxZoom || 24]).clickDistance(6)
    .translateExtent([[-W*0.5, -H*0.5], [W*1.5, H*1.5]])
    .on('zoom', ev => { k = ev.transform.k; g.attr('transform', ev.transform); listeners.forEach(f => f(k)); hideTip(); });
  svg.call(zoom).on('dblclick.zoom', null);
  const ctl = d3.select(stage).append('div').attr('class', 'mapctl');
  ctl.append('button').attr('class', 'btn iconbtn').attr('aria-label', 'Zoom in').text('+').on('click', () => svg.transition().duration(250).call(zoom.scaleBy, 1.6));
  ctl.append('button').attr('class', 'btn iconbtn').attr('aria-label', 'Zoom out').text('−').on('click', () => svg.transition().duration(250).call(zoom.scaleBy, 1/1.6));
  ctl.append('button').attr('class', 'btn iconbtn').attr('aria-label', 'Reset view').html('⟲').on('click', () => svg.transition().duration(300).call(zoom.transform, d3.zoomIdentity));
  cleanup.push(() => svg.on('.zoom', null));
  return { svg, g, path, proj, W, H, showTip, hideTip, onZoom:f => listeners.push(f), zoom, getK:() => k };
}
/** Pins + labels + routes for a set of trips.
 *  keep(d) says whether a stop is inside the place being shown. Stops outside it are drawn
 *  hollow (when they're on the map) and each trip's whole route is drawn, so a trip that
 *  carries on into another state or country visibly leads there. */
function drawPins(map, trips, keep, opts = {}){
  const { g, proj } = map;
  const R = opts.r || 7;
  const away = opts.away !== false;
  const xy = d => proj([d.lon, d.lat]);
  const shows = d => keep(d) || (away && xy(d));
  const gR = g.append('g'), gP = g.append('g');
  const lines = trips.map(t => ({ t, pts:(t.destinations||[]).filter(shows) })).filter(x => x.pts.length > 1);
  const routes = gR.selectAll('path').data(lines).join('path').attr('class', 'route')
    .style('stroke', x => Owners.tripColor(x.t))
    .attr('d', x => opts.straight ? 'M' + x.pts.map(xy).join('L') : map.path({ type:'LineString', coordinates:x.pts.map(d => [d.lon, d.lat]) }));
  const items = trips.flatMap(t => (t.destinations||[]).map((d, i) => ({ t, d, i, n:t.destinations.length, local:!!keep(d) })))
    .filter(p => p.local || (away && xy(p.d)))
    .sort((a, b) => a.local - b.local);
  const pins = gP.selectAll('g').data(items).join('g').attr('class', p => 'pin' + (p.local ? '' : ' away'))
    .attr('transform', p => { const q = xy(p.d); return q ? `translate(${q})` : 'translate(-999,-999)'; });
  const numbered = p => opts.numbers && p.n > 1;
  pins.append('circle')
    .attr('r', p => p.local ? (numbered(p) ? R + 2 : R) : Math.max(4, R * 0.7))
    .style('fill', p => p.local ? Owners.tripColor(p.t) : '#fff')
    .style('stroke', p => p.local ? '#fff' : Owners.tripColor(p.t))
    .attr('tabindex', p => p.local ? 0 : -1).attr('role', 'link')
    .attr('aria-label', p => `${p.t.title}: stop ${p.i + 1}, ${p.d.name}`);
  pins.filter(p => p.local && numbered(p)).append('text').attr('class', 'num').attr('y', 4).text(p => p.i + 1);
  if (opts.labels){
    // Place each label right, left, above or below its pin, whichever bumps into
    // nothing already placed and stays on screen.
    const off = R + 5, H = 14, placed = [];
    const clip = str => str.length > 34 ? str.slice(0, 32) + '…' : str;
    items.filter(p => p.local).forEach(p => { const q = xy(p.d); if (q) placed.push([q[0] - R, q[1] - R, R * 2, R * 2]); });
    const hit = (a, b) => a[0] < b[0] + b[2] && b[0] < a[0] + a[2] && a[1] < b[1] + b[3] && b[1] < a[1] + a[3];
    pins.filter(p => p.local).append('text').text(p => clip(opts.labelFn ? opts.labelFn(p) : p.t.title))
      .each(function(p){
        const q = xy(p.d) || [0, 0], w = this.getComputedTextLength();
        const cands = [
          { x:off, y:4, a:'start', box:[q[0] + off, q[1] - 9, w, H] },
          { x:-off, y:4, a:'end', box:[q[0] - off - w, q[1] - 9, w, H] },
          { x:0, y:-off - 3, a:'middle', box:[q[0] - w / 2, q[1] - off - 14, w, H] },
          { x:0, y:off + 11, a:'middle', box:[q[0] - w / 2, q[1] + off, w, H] },
        ];
        const score = c => placed.filter(b => hit(c.box, b)).length * 10 + (c.box[0] < 4 || c.box[0] + w > map.W - (opts.edgePad ?? 56) ? 5 : 0);
        const best = cands.reduce((m, c) => score(c) < score(m) ? c : m, cands[0]);
        placed.push(best.box);
        d3.select(this).attr('x', best.x).attr('y', best.y).attr('text-anchor', best.a);
      });
  }
  const where = d => [d.stateName, d.countryName].filter(Boolean).join(', ');
  pins.on('mousemove', (ev, p) => map.showTip(ev, `<b>${esc(p.t.title)}</b> · ${p.n > 1 ? (p.i + 1) + '. ' : ''}${esc(p.d.name)}${p.local ? '' : ` <span style="opacity:.7">(${esc(where(p.d))})</span>`}`))
      .on('mouseleave', map.hideTip)
      .on('click', (ev, p) => { ev.stopPropagation(); go(opts.onPin ? opts.onPin(p) : 'trip-' + p.t.id); })
      .on('keydown', (ev, p) => { if (ev.key === 'Enter') go(opts.onPin ? opts.onPin(p) : 'trip-' + p.t.id); });
  map.onZoom && map.onZoom(k => {
    pins.attr('transform', p => { const q = xy(p.d); return q ? `translate(${q}) scale(${1/k})` : null; });
  });
  return { highlight(t){ pins.classed('hot', p => t && p.t === t); routes.classed('hot', x => t && x.t === t); if (t){ pins.filter(p => p.t === t).raise(); routes.filter(x => x.t === t).raise(); } } };
}
function placeListPanel(panel, title, sub, trips, pinApi, extra = ''){
  panel.innerHTML = `${statusBanner()}<h2>${esc(title)}</h2><p class="sub">${esc(sub)}</p>${extra}<h3>Trips here</h3><div id="listWrap"></div>`;
  const wrap = $('#listWrap', panel);
  if (!trips.length){ wrap.innerHTML = `<div class="empty">No trips here yet.<br><a class="btn primary sm" href="#new">＋ Add a trip</a></div>`; return; }
  wrap.innerHTML = `<ul class="triplist">${trips.map(tripItemHTML).join('')}</ul>`;
  wireTripList($('ul', wrap), trips, pinApi ? { enter:t => pinApi.highlight(t), leave:() => pinApi.highlight(null) } : {});
}

/* ---------- continent view ---------- */
function viewContinent(id, panel, stage){
  const C = CONTINENTS[id];
  setCrumbs([{ t:'World', h:'world' }, { t:C.name }]);
  stage.setAttribute('aria-label', `Map of ${C.name}`);
  let proj;
  const W = stage.clientWidth, H = stage.clientHeight, pad = 18;
  if (id === 'antarctica'){
    proj = d3.geoAzimuthalEqualArea().rotate([0, 90]).fitExtent([[pad,pad],[W-pad,H-pad]], G.countries.find(f => f.cont === 'antarctica') || { type:'Sphere' });
  } else {
    const [[x0,y0],[x1,y1]] = C.box; const cx = (x0 + x1) / 2;
    proj = d3.geoMercator().rotate([-cx, 0]).fitExtent([[pad,pad],[W-pad,H-pad]], { type:'MultiPoint', coordinates:[[x0,y0],[x1,y1],[x0,y1],[x1,y0]] });
  }
  const map = makeFlatMap(stage, proj);
  const inC = f => f.cont === id;
  const isUS = f => f.key === G.usKey;
  map.g.append('g').selectAll('path').data(G.countries).join('path')
    .attr('d', map.path)
    .attr('class', f => 'country' + (inC(f) ? (isUS(f) ? '' : ' clickable') : ' muted') + (IDX.visitedCountries.has(f.key) && !isUS(f) ? ' visited' : ''))
    .style('fill', f => isUS(f) ? null : paintPlace(f.key, !inC(f)))
    .on('mousemove', function(ev, f){ if (!inC(f) || isUS(f)) return; d3.select(this).classed('hl', true); const n = tripsAt(f.key).length; map.showTip(ev, `<b>${esc(f.name)}</b>${n ? ` · ${n} trip${n>1?'s':''}` : ''}`); })
    .on('mouseleave', function(){ d3.select(this).classed('hl', false); map.hideTip(); })
    .on('click', (ev, f) => { if (inC(f) && !isUS(f)) go('country-' + f.key.slice(2)); });
  if (id === 'north-america'){
    map.g.append('g').selectAll('path').data(G.states).join('path').attr('d', map.path)
      .attr('class', s => 'state clickable' + (IDX.visitedStates.has(s.id) ? ' visited' : ''))
      .style('fill', s => paintPlace('s-' + s.id, false))
      .on('mousemove', (ev, s) => { const n = tripsAt('s-' + s.id).length; map.showTip(ev, `<b>${esc(s.name)}</b>${n ? ` · ${n} trip${n>1?'s':''}` : ''}`); })
      .on('mouseleave', map.hideTip)
      .on('click', (ev, s) => go('state-' + s.id));
  }
  const trips = tripsAt('k-' + id);
  const pinApi = drawPins(map, trips, d => { const f = G.byKey.get(d.country); return f && f.cont === id; }, { r:5 });
  addHeatLegend(stage);
  d3.select(stage).append('div').attr('class', 'maphint').text(id === 'north-america' ? 'Tap a country or US state' : 'Tap a country to see its trips');
  // panel: visited places + find a place + trips
  const visited = G.countries.filter(f => inC(f) && IDX.visitedCountries.has(f.key)).sort((a,b) => a.name.localeCompare(b.name));
  const visitedStates = id === 'north-america' ? G.states.filter(s => IDX.visitedStates.has(s.id)).sort((a,b) => a.name.localeCompare(b.name)) : [];
  const chips = [...visited.map(f => isUS(f) ? `<a class="chip" href="#country-840"><span class="dot" style="background:${paintPlace(G.usKey)}"></span>United States · ${tripsAt(G.usKey).length}</a>` : `<a class="chip" href="#country-${f.key.slice(2)}"><span class="dot" style="background:${paintPlace(f.key)}"></span>${esc(f.name)} · ${tripsAt(f.key).length}</a>`),
                 ...visitedStates.map(s => `<a class="chip" href="#state-${s.id}"><span class="dot" style="background:${paintPlace('s-' + s.id)}"></span>${esc(s.name)} · ${tripsAt('s-' + s.id).length}</a>`)].join('');
  const placeOpts = [...G.countries.filter(inC).map(f => ({ n:f.name, h:'country-' + f.key.slice(2) })), ...(id === 'north-america' ? G.states.map(s => ({ n:s.name + ' (US)', h:'state-' + s.id })) : [])].sort((a,b) => a.n.localeCompare(b.n));
  const extra = `${chips ? `<h3>Places you've been</h3><div class="chips">${chips}</div>` : ''}
    <h3>Jump to a place</h3><div class="search">${ICON.search}<label class="sr-only" for="jump">Find a country${id==='north-america'?' or state':''}</label><input id="jump" type="search" list="jumpList" placeholder="Find a country${id==='north-america'?' or state':''}…"><datalist id="jumpList">${placeOpts.map(o => `<option value="${esc(o.n)}">`).join('')}</datalist></div>`;
  const nC = visited.length;
  placeListPanel(panel, C.name, `${nC} of ${G.countries.filter(inC).length} countries visited`, trips, pinApi, extra);
  const jump = $('#jump', panel);
  jump.addEventListener('change', () => { const o = placeOpts.find(o => o.n.toLowerCase() === jump.value.trim().toLowerCase()); if (o) go(o.h); });
}

/* ---------- state / country view ---------- */
function mainGeometry(f){
  if (f.geometry.type !== 'MultiPolygon') return f;
  const parts = f.geometry.coordinates.map(c => ({ c, a:d3.geoArea({ type:'Polygon', coordinates:c }) }));
  const max = d3.max(parts, p => p.a);
  return { type:'Feature', geometry:{ type:'MultiPolygon', coordinates:parts.filter(p => p.a >= max * 0.2).map(p => p.c) } };
}
function viewPlace(kind, id, panel, stage){
  const W = stage.clientWidth, H = stage.clientHeight;
  const pad = isNarrow() ? 30 : 50;
  if (kind === 'country' && id === G.usKey) return viewUSA(panel, stage);
  const f = kind === 'country' ? G.byKey.get(id) : G.stateById.get(id);
  if (!f){ stage.innerHTML = '<div class="loading">That place wasn’t found.</div>'; setCrumbs([{ t:'World', h:'world' }, { t:'Not found' }]); return; }
  const cont = kind === 'country' ? f.cont : 'north-america';
  const crumbs = [{ t:'World', h:'world' }, { t:CONTINENTS[cont].name, h:'continent-' + cont }];
  if (kind === 'state') crumbs.push({ t:'United States', h:'country-840' });
  crumbs.push({ t:f.name });
  setCrumbs(crumbs);
  stage.setAttribute('aria-label', `Map of ${f.name}`);
  const placeKey = kind === 'country' ? f.key : 's-' + f.id;
  const trips = tripsAt(placeKey);
  const keep = d => kind === 'country' ? d.country === f.key : d.state === f.id;
  const pts = trips.flatMap(t => (t.destinations||[]).filter(keep).map(d => [d.lon, d.lat]));
  const fitTo = { type:'FeatureCollection', features:[mainGeometry(f), ...(pts.length ? [{ type:'Feature', geometry:{ type:'MultiPoint', coordinates:pts } }] : [])] };
  const c = d3.geoCentroid(mainGeometry(f));
  const proj = d3.geoMercator().rotate([-c[0], 0]).fitExtent([[pad, pad], [W - pad - (isNarrow() ? 0 : 40), H - pad]], fitTo);
  const map = makeFlatMap(stage, proj, { maxZoom:40 });
  // context
  map.g.append('g').selectAll('path').data(G.countries).join('path').attr('d', map.path)
    .attr('class', d => 'country' + (d === f ? ' focus' : ' muted') + (IDX.visitedCountries.has(d.key) && d.key !== G.usKey ? ' visited' : ''))
    .style('fill', d => d.key === G.usKey ? null : paintPlace(d.key, d !== f))
    .filter(d => d !== f && d.key !== G.usKey).classed('clickable', true)
    .on('mousemove', (ev, d) => map.showTip(ev, esc(d.name))).on('mouseleave', map.hideTip)
    .on('click', (ev, d) => go('country-' + d.key.slice(2)));
  if (kind === 'state' || f.key === 'c-124' || f.key === 'c-484'){
    map.g.append('g').selectAll('path').data(G.states).join('path').attr('d', map.path)
      .attr('class', s => 'state' + (kind === 'state' && s === f ? '' : ' clickable') + (IDX.visitedStates.has(s.id) ? ' visited' : ''))
      .style('fill', s => kind === 'state' && s === f ? (IDX.visitedStates.has(s.id) ? (paintPlace('s-' + s.id, false) || 'var(--visited-2)') : '#e1d6bf') : paintPlace('s-' + s.id, true))
      .style('stroke', s => kind === 'state' && s === f ? 'var(--ink)' : null).style('stroke-width', s => kind === 'state' && s === f ? '1.4px' : null)
      .on('mousemove', (ev, s) => map.showTip(ev, esc(s.name))).on('mouseleave', map.hideTip)
      .on('click', (ev, s) => { if (!(kind === 'state' && s === f)) go('state-' + s.id); });
  }
  const pinApi = drawPins(map, trips, keep, { labels:true, numbers:true, labelFn:p => {
    const here = (p.t.destinations||[]).filter(keep).length;
    return here > 1 || p.n > 1 ? `${p.d.name} · ${p.t.title}` : p.t.title;
  } });
  addHeatLegend(stage);
  d3.select(stage).append('div').attr('class', 'maphint').text(trips.length ? 'Tap a pin to open the trip' : 'No trips here yet');
  const nStops = pts.length;
  placeListPanel(panel, f.name, trips.length ? `${trips.length} trip${trips.length>1?'s':''} · ${nStops} stop${nStops>1?'s':''}` : 'Not visited yet', trips, pinApi);
}
function viewUSA(panel, stage){
  setCrumbs([{ t:'World', h:'world' }, { t:'North America', h:'continent-north-america' }, { t:'United States' }]);
  const W = stage.clientWidth, H = stage.clientHeight, pad = 20;
  const proj = d3.geoAlbersUsa().fitExtent([[pad, pad], [W - pad - (isNarrow() ? 0 : 50), H - pad]], G.nation);
  const map = makeFlatMap(stage, proj);
  stage.style.background = 'var(--paper-2)';
  map.g.append('g').selectAll('path').data(G.states).join('path').attr('d', map.path)
    .attr('class', s => 'state clickable' + (IDX.visitedStates.has(s.id) ? ' visited' : ''))
    .style('fill', s => paintPlace('s-' + s.id, false))
    .on('mousemove', (ev, s) => { const n = tripsAt('s-' + s.id).length; map.showTip(ev, `<b>${esc(s.name)}</b>${n ? ` · ${n} trip${n>1?'s':''}` : ''}`); })
    .on('mouseleave', map.hideTip).on('click', (ev, s) => go('state-' + s.id));
  const trips = tripsAt(G.usKey);
  const pinApi = drawPins(map, trips, d => d.country === G.usKey && proj([d.lon, d.lat]), { r:5, away:false, straight:true });
  addHeatLegend(stage);
  d3.select(stage).append('div').attr('class', 'maphint').text('Tap a state');
  const vs = G.states.filter(s => IDX.visitedStates.has(s.id)).sort((a,b) => a.name.localeCompare(b.name));
  const extra = vs.length ? `<h3>States you've been</h3><div class="chips">${vs.map(s => `<a class="chip" href="#state-${s.id}"><span class="dot" style="background:${paintPlace('s-' + s.id)}"></span>${esc(s.name)} · ${tripsAt('s-' + s.id).length}</a>`).join('')}</div>` : '';
  placeListPanel(panel, 'United States', `${vs.length} of 50 states visited`, trips, pinApi, extra);
}

/** A static map of one trip: every stop numbered, the route between them, and the
 *  states/countries it passes through filled in. Works for trips spanning many places. */
function drawRouteMap(el, t){
  const ds = (t.destinations || []).filter(d => isFinite(d.lon) && isFinite(d.lat));
  if (!ds.length){ el.innerHTML = '<div class="loading">No locations yet.</div>'; return; }
  const W = el.clientWidth, H = el.clientHeight, pad = 40;
  const places = [];
  for (const d of ds){ const f = d.state ? G.stateById.get(d.state) : G.byKey.get(d.country); if (f && !places.includes(f)) places.push(f); }
  const pts = { type:'Feature', geometry:{ type:'MultiPoint', coordinates:ds.map(d => [d.lon, d.lat]) } };
  const c = d3.geoCentroid(pts.geometry);
  // Frame the stops themselves (with breathing room), not the whole states/countries,
  // so nearby stops don't get squashed together.
  const xs = ds.map(d => d.lon - c[0]), ys = ds.map(d => d.lat);
  let [x0, x1, y0, y1] = [d3.min(xs), d3.max(xs), d3.min(ys), d3.max(ys)];
  const sx = Math.max(x1 - x0, 4), sy = Math.max(y1 - y0, 2.5);
  const mx = (x0 + x1) / 2 + c[0], my = (y0 + y1) / 2;
  const frame = { type:'MultiPoint', coordinates:[[mx - sx * 0.8, my - sy * 0.8], [mx + sx * 0.8, my + sy * 0.8], [mx - sx * 0.8, my + sy * 0.8], [mx + sx * 0.8, my - sy * 0.8]] };
  const proj = d3.geoMercator().rotate([-c[0], 0]).fitExtent([[pad, pad], [W - pad, H - pad]], frame);
  const path = d3.geoPath(proj);
  const svg = d3.select(el).append('svg').attr('viewBox', `0 0 ${W} ${H}`).attr('role', 'img')
    .attr('aria-label', `Map of the route: ${ds.map((d, i) => `${i + 1}. ${d.name}`).join(', ')}`);
  const g = svg.append('g');
  const fill = HUES[Owners.tripHue(t)].light;
  const inTrip = new Set(places);
  const hasUS = ds.some(d => d.state);
  const tip = d3.select(el).append('div').attr('class', 'tip');
  const showTip = (ev, html) => { const [x, y] = d3.pointer(ev, el); tip.html(html).style('left', x + 'px').style('top', y + 'px').classed('on', true); };
  const hideTip = () => tip.classed('on', false);
  g.append('g').selectAll('path').data(G.countries).join('path').attr('d', path)
    .attr('class', f => 'country' + (inTrip.has(f) ? ' clickable' : ' muted'))
    .style('fill', f => inTrip.has(f) ? fill : null)
    .on('mousemove', (ev, f) => inTrip.has(f) && showTip(ev, esc(f.name))).on('mouseleave', hideTip)
    .on('click', (ev, f) => { if (inTrip.has(f)) go('country-' + f.key.slice(2)); });
  if (hasUS){
    g.append('g').selectAll('path').data(G.states).join('path').attr('d', path)
      .attr('class', s => 'state' + (inTrip.has(s) ? ' clickable' : ''))
      .style('fill', s => inTrip.has(s) ? fill : 'transparent')
      .on('mousemove', (ev, s) => inTrip.has(s) && showTip(ev, esc(s.name))).on('mouseleave', hideTip)
      .on('click', (ev, s) => { if (inTrip.has(s)) go('state-' + s.id); });
  }
  drawPins({ g, proj, path, W, showTip, hideTip }, [t], () => true, {
    r:8, numbers:true, labels:true, edgePad:6, labelFn:p => p.d.name, onPin:p => placeHash(p.d),
  });
  g.selectAll('.route').style('stroke-width', '3px');
}

function viewTrip(id, stage){
  const t = Store.trips.find(x => x.id === id);
  if (!t){
    setCrumbs([{ t:'World', h:'world' }, { t:'Trip' }]);
    stage.innerHTML = `<div class="page"><div class="empty">${Store.loaded ? 'This trip doesn’t exist anymore.' : 'Loading trip…'}<br><a class="btn sm" href="#world">Back to the globe</a></div></div>`;
    return;
  }
  const d0 = (t.destinations || [])[0];
  const crumbs = [{ t:'World', h:'world' }];
  if (d0){ const f = G.byKey.get(d0.country); if (f){ crumbs.push({ t:CONTINENTS[f.cont].name, h:'continent-' + f.cont }); crumbs.push({ t:d0.stateName || f.name, h:placeHash(d0) }); } }
  crumbs.push({ t:t.title || 'Trip' });
  setCrumbs(crumbs);
  const photos = t.photos || [];
  stage.innerHTML = `<div class="page">
    <div class="pagehead"><h1>${esc(t.title || 'Untitled trip')}</h1>
      <a class="btn" href="#edit-${esc(t.id)}">Edit trip</a></div>
    <article class="tripcard">
      <div class="gallery" aria-roledescription="carousel" aria-label="Pictures">
        ${photos.length ? `<div class="frame"><img alt=""><button class="nav prev" aria-label="Previous picture">${ICON.left}</button><button class="nav next" aria-label="Next picture">${ICON.right}</button></div>
          <div class="bar"><span class="count" aria-live="polite"></span><div class="dots" role="tablist">${photos.map((p, i) => `<button role="tab" aria-label="Picture ${i+1}"></button>`).join('')}</div><span class="cap"></span></div>`
        : `<div class="frame"><div class="none">No pictures yet.<br><br><a class="btn sm" href="#edit-${esc(t.id)}">Add pictures</a></div></div>`}
      </div>
      <div class="tripinfo">
        <div><div class="lbl">Dates</div><div class="dates">${esc(fmtRange(t.startDate, t.endDate))}</div></div>
        ${Owners.of(t).length ? `<div><div class="lbl">Who went</div><div class="chips">${Owners.of(t).map(o => `<span class="chip" style="cursor:default"><span class="dot" style="background:${Owners.color(o)}"></span>${esc(o)}</span>`).join('')}</div></div>` : ''}
        <div><div class="lbl">${(t.destinations||[]).length > 1 ? 'Route' : 'Where'}</div><div class="chips">${(t.destinations||[]).map((d, i) => `<a class="chip" href="#${placeHash(d)}" title="${esc([d.stateName, d.countryName].filter(Boolean).join(', '))}"><span class="dot"></span>${(t.destinations.length > 1 ? (i+1) + '. ' : '') + esc(d.name)}</a>`).join('') || '<span class="sub">No places</span>'}</div></div>
        ${(t.friends||[]).length ? `<div><div class="lbl">With</div><div class="chips">${t.friends.map(f => `<span class="chip" style="cursor:default">${esc(f)}</span>`).join('')}</div></div>` : ''}
        ${tripPlaceList(t).length > 1 ? `<div><div class="lbl">Places</div><div class="chips">${tripPlaceList(t).map(p => `<a class="chip" href="#${p.h}">${esc(p.n)}</a>`).join('')}</div></div>` : ''}
        <div><div class="lbl">Notes</div><div class="notes">${t.notes ? esc(t.notes) : '<span class="sub">No notes.</span>'}</div></div>
      </div>
    </article>
    <section class="routecard" aria-labelledby="routeTitle">
      <div class="rchead"><h2 id="routeTitle">${(t.destinations||[]).length > 1 ? 'Route' : 'Location'}</h2>
        <span class="sub">${(t.destinations||[]).length} stop${(t.destinations||[]).length === 1 ? '' : 's'}${tripPlaceList(t).length ? ' · ' + esc(tripPlaceList(t).map(p => p.n).join(', ')) : ''}</span></div>
      <div class="routemap" id="routeMap"></div>
    </section></div>`;
  drawRouteMap($('#routeMap', stage), t);
  if (!photos.length) return;
  // carousel
  let i = 0;
  const img = $('.frame img', stage), dots = [...stage.querySelectorAll('.dots button')];
  const show = (n) => {
    i = (n + photos.length) % photos.length;
    img.removeAttribute('src'); setPhoto(img, photos[i]);
    img.alt = photos[i].caption || `Picture ${i+1} of ${t.title}`;
    $('.count', stage).textContent = `${i+1} / ${photos.length}`;
    $('.cap', stage).textContent = photos[i].caption || '';
    dots.forEach((d, k) => { d.classList.toggle('on', k === i); d.setAttribute('aria-selected', k === i); });
    // warm the next image
    if (photos.length > 1) Store.photoSrc(photos[(i+1) % photos.length]).then(s => { if (s) { const pre = new Image(); pre.src = s; } });
  };
  $('.prev', stage).addEventListener('click', () => show(i - 1));
  $('.next', stage).addEventListener('click', () => show(i + 1));
  if (photos.length < 2) stage.querySelectorAll('.gallery .nav').forEach(b => b.style.display = 'none');
  dots.forEach((d, k) => d.addEventListener('click', () => show(k)));
  const onKey = (e) => { if ($('.lightbox')) { if (e.key === 'Escape') $('.lightbox').remove(); } if (e.target.closest('input,textarea')) return; if (e.key === 'ArrowLeft') show(i - 1); if (e.key === 'ArrowRight') show(i + 1); };
  document.addEventListener('keydown', onKey); cleanup.push(() => document.removeEventListener('keydown', onKey));
  // swipe
  let sx = null;
  const frame = $('.frame', stage);
  frame.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive:true });
  frame.addEventListener('touchend', e => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 40) show(i + (dx < 0 ? 1 : -1)); sx = null; });
  img.addEventListener('click', () => {
    const lb = document.createElement('div'); lb.className = 'lightbox'; lb.setAttribute('role', 'dialog'); lb.setAttribute('aria-label', 'Picture');
    lb.innerHTML = `<img alt="${esc(img.alt)}" src="${img.src}"><button class="btn iconbtn x" aria-label="Close">✕</button>`;
    lb.addEventListener('click', () => lb.remove());
    document.body.appendChild(lb); $('.x', lb).focus();
    cleanup.push(() => lb.remove());
  });
  show(0);
}

  const addFriend = () => { const v = fIn.value.replace(/,/g, '').trim(); if (v && !T.friends.includes(v)) T.friends.push(v); fIn.value = ''; drawFriends(); };
  fIn.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ','){ e.preventDefault(); addFriend(); } else if (e.key === 'Backspace' && !fIn.value && T.friends.length){ T.friends.pop(); drawFriends(); } });
  fIn.addEventListener('blur', addFriend);
  fBox.addEventListener('click', e => { if (e.target === fBox) fIn.focus(); });
  drawFriends();
  // who went (Tommy / Katherine / both)
  let lastOwners = []; try { lastOwners = JSON.parse(lsGet('tripatlas.lastOwners') || '[]'); } catch(e){}
  const selOwners = existing ? Owners.of(T) : PEOPLE.filter(p => lastOwners.includes(p));
  const drawOwners = () => {
    $('#ownerPick', stage).innerHTML = PEOPLE.map(n => `<button type="button" class="ochip big" style="--c:${Owners.color(n)}" aria-pressed="${selOwners.includes(n)}" data-pick="${esc(n)}"><i></i>${esc(n)}</button>`).join('') +
      `<span class="pickhint" style="--c:${HUES[Owners.hueKey(new Set(selOwners))].pin}">${selOwners.length === 2 ? 'Shows in blue — you both went' : selOwners.length ? `Shows in ${selOwners[0] === PEOPLE[0] ? 'purple' : 'green'}` : ''}</span>`;
  };
  $('#ownerPick', stage).addEventListener('click', e => {
    const b = e.target.closest('[data-pick]'); if (!b) return;
    const n = b.dataset.pick, k = selOwners.indexOf(n);
    k >= 0 ? selOwners.splice(k, 1) : selOwners.push(n);
    formDirty = true; drawOwners();
  });
  drawOwners();
  // photos
  const drawPhotos = () => {
    const all = [...T.photos.map((p, i) => ({ kind:'old', p, i })), ...pending.map((p, i) => ({ kind:'new', p, i }))];
    const el = $('#photos', stage);
    el.innerHTML = all.map((x, k) => `<div class="ph">${k === 0 ? '<span class="cover">Cover</span>' : ''}<img alt=""><div class="tools">
      ${k > 0 ? `<button type="button" data-cover="${k}" aria-label="Make cover" title="Make cover">★</button>` : ''}
      <button type="button" data-rm="${k}" aria-label="Remove picture" title="Remove">✕</button></div>
      <input type="text" data-cap="${k}" placeholder="Caption" value="${esc(x.p.caption || '')}" aria-label="Caption for picture ${k+1}"></div>`).join('');
    el.querySelectorAll('img').forEach((img, k) => { const x = all[k]; if (x.kind === 'new') img.src = x.p.url; else setPhoto(img, x.p); });
    el.querySelectorAll('input[data-cap]').forEach(inp => inp.addEventListener('input', () => { const x = all[+inp.dataset.cap]; x.p.caption = inp.value; }));
    el.querySelectorAll('button[data-rm]').forEach(b => b.onclick = () => { const x = all[+b.dataset.rm]; if (x.kind === 'old'){ removed.push(T.photos[x.i]); T.photos.splice(x.i, 1); } else { URL.revokeObjectURL(x.p.url); pending.splice(x.i, 1); } formDirty = true; drawPhotos(); });
    el.querySelectorAll('button[data-cover]').forEach(b => b.onclick = () => {
      const x = all[+b.dataset.cover];
      if (x.kind === 'old'){ const [p] = T.photos.splice(x.i, 1); T.photos.unshift(p); }
      else { const [p] = pending.splice(x.i, 1); pending.unshift(p); p.cover = true; pending.forEach(q => { if (q !== p) q.cover = false; }); }
      formDirty = true; drawPhotos();
    });
  };
  const addFiles = (files) => { for (const f of files){ if (!f.type.startsWith('image/') && !/\.(heic|heif)$/i.test(f.name)) continue; pending.push({ file:f, url:URL.createObjectURL(f), caption:'' }); } formDirty = true; drawPhotos(); };
  $('#fFiles', stage).addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });
  const drop = $('#drop', stage);
  ['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => addFiles(e.dataTransfer.files));
  drawPhotos();
  cleanup.push(() => pending.forEach(p => URL.revokeObjectURL(p.url)));
  // save
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const err = $('#err', stage), prog = $('#prog', stage), btn = $('#saveBtn', stage);
    err.textContent = '';
    addFriend();
    T.title = $('#fTitle', stage).value.trim();
    T.startDate = $('#fStart', stage).value; T.endDate = $('#fEnd', stage).value;
    T.notes = $('#fNotes', stage).value.trim();
    if (!T.title){ err.textContent = 'Give the trip a title.'; $('#fTitle', stage).focus(); return; }
    if (!selOwners.length){ err.textContent = `Pick who went: ${PEOPLE.join(', ')}, or both.`; $('#ownerPick button', stage).focus(); return; }
    T.owners = PEOPLE.filter(p => selOwners.includes(p));
    if (!T.destinations.length){ err.textContent = 'Add at least one location so the trip shows up on the map.'; $('#addDest', stage).focus(); return; }
    if (T.startDate && T.endDate && T.endDate < T.startDate){ err.textContent = 'The end date is before the start date.'; $('#fEnd', stage).focus(); return; }
    btn.disabled = true;
    try {
      const uploaded = [];
      for (let k = 0; k < pending.length; k++){
        prog.textContent = `Uploading picture ${k+1} of ${pending.length}…`;
        const r = await Store.uploadPhoto(pending[k].file);
        uploaded.push({ ...r, caption:pending[k].caption || '', cover:pending[k].cover });
      }
      const coverNew = uploaded.findIndex(u => u.cover);
      uploaded.forEach(u => delete u.cover);
      if (coverNew >= 0){ const [c] = uploaded.splice(coverNew, 1); T.photos = [c, ...T.photos, ...uploaded]; }
      else T.photos = [...T.photos, ...uploaded];
      prog.textContent = 'Saving…';
      await Store.save(T);
      for (const p of removed) await Store.deletePhoto(p);
      formDirty = false;
      pending.length = 0;
      lsSet('tripatlas.lastOwners', JSON.stringify(T.owners));
      toast(existing ? 'Trip updated' : 'Trip saved');
      go('trip-' + T.id);
    } catch(ex){
      btn.disabled = false; prog.textContent = '';
      err.textContent = ex && (ex.name === 'QuotaExceededError' || /quota|full/i.test(ex.message || '')) ? 'This browser is out of storage space. Remove some pictures or trips and try again.' : (ex && ex.message) ? 'Could not save: ' + ex.message : 'Could not save. Try again.';
    }
  });
  const del = $('#delBtn', stage);
  if (del) del.addEventListener('click', () => confirmBox(`Delete “${existing.title}”?`, 'This removes the trip and its pictures from this browser. It can’t be undone unless you have a backup.', 'Delete trip', async () => {
    try { await Store.remove(T.id); for (const p of existing.photos || []) await Store.deletePhoto(p); formDirty = false; toast('Trip deleted'); go('world'); }
    catch(e){ toast('Could not delete the trip'); }
  }));
  $('#fTitle', stage).focus({ preventScroll:true });
}
function confirmBox(title, body, okLabel, onOk){
  const m = document.createElement('div'); m.className = 'modal confirm'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true');
  m.innerHTML = `<div class="box"><h2>${esc(title)}</h2><p class="sub">${esc(body)}</p><div class="formactions" style="justify-content:flex-end"><button class="btn" data-x>Cancel</button><button class="btn primary" style="background:var(--danger);border-color:var(--danger)" data-ok>${esc(okLabel)}</button></div></div>`;
  document.body.appendChild(m);
  const close = () => m.remove();
  m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-x]')) close(); });
  $('[data-ok]', m).addEventListener('click', () => { close(); onOk(); });
  $('[data-x]', m).focus();
  m.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
}

/* ---------- location picker ---------- */
function openPicker(current, onDone){
  const near = current && current.near;
  if (near) current = null;
  let sel = current ? { ...current } : null;
  const m = document.createElement('div'); m.className = 'modal'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true'); m.setAttribute('aria-labelledby', 'pkTitle');
  m.innerHTML = `<div class="box">
    <div class="mh"><h2 id="pkTitle">${current ? 'Change location' : 'Add a location'}</h2><button class="btn iconbtn ghost" data-x aria-label="Close">✕</button></div>
    <div class="picker">
      <div class="side">
        <div class="search" style="margin:0">${ICON.search}<label class="sr-only" for="pkQ">Search a city, country or US state</label><input id="pkQ" type="search" placeholder="Search a city, country or state…" autocomplete="off"></div>
        <ul class="results" id="pkRes"></ul>
        <p class="sub" style="margin:0">Or tap the map to drop a pin anywhere — a park, a beach, a trailhead.</p>
        <div class="field"><label for="pkName">Name this stop</label><input type="text" id="pkName" placeholder="e.g. Zion National Park" maxlength="80"></div>
        <div class="picked" id="pkInfo">No location picked yet.</div>
      </div>
      <div class="mapwrap" id="pkMap"></div>
    </div>
    <div class="mf"><button class="btn" data-x>Cancel</button><button class="btn primary" id="pkOk" disabled>${current ? 'Update location' : 'Add location'}</button></div>
  </div>`;
  document.body.appendChild(m);
  const prevFocus = document.activeElement;
  const close = () => { m.remove(); document.removeEventListener('keydown', onEsc); if (prevFocus) prevFocus.focus({ preventScroll:true }); };
  const onEsc = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onEsc);
  m.querySelectorAll('[data-x]').forEach(b => b.onclick = close);
  const nameIn = $('#pkName', m), info = $('#pkInfo', m), ok = $('#pkOk', m), q = $('#pkQ', m), res = $('#pkRes', m);
  if (sel) nameIn.value = sel.name;
  let nameTouched = !!current;
  nameIn.addEventListener('input', () => { nameTouched = true; refresh(); });

  // map
  const wrap = $('#pkMap', m);
  const W = wrap.clientWidth, H = wrap.clientHeight;
  const proj = d3.geoMercator().fitExtent([[10, 10], [W - 10, H - 10]], { type:'MultiPoint', coordinates:[[-170, -56], [190, 74]] }).rotate([-10, 0]);
  proj.fitExtent([[10, 10], [W - 10, H - 10]], { type:'MultiPoint', coordinates:[[-170, -56], [190, 74]] });
  const path = d3.geoPath(proj);
  const svg = d3.select(wrap).append('svg').attr('viewBox', `0 0 ${W} ${H}`).attr('aria-label', 'Map — tap to place a pin');
  const g = svg.append('g');
  const cPaths = g.append('g').selectAll('path').data(G.countries).join('path').attr('d', path).attr('class', 'country');
  const sPaths = g.append('g').selectAll('path').data(G.states).join('path').attr('d', path).attr('class', 'state').style('pointer-events', 'none');
  const pin = g.append('g').attr('class', 'pin').attr('display', 'none'); pin.append('circle').attr('r', 8);
  let k = 1;
  const zoom = d3.zoom().scaleExtent([1, 200]).clickDistance(6).translateExtent([[-W*0.2, -H*0.2], [W*1.2, H*1.2]])
    .on('zoom', ev => { k = ev.transform.k; g.attr('transform', ev.transform); placePin(); });
  svg.call(zoom).on('dblclick.zoom', null);
  const ctl = d3.select(wrap).append('div').attr('class', 'mapctl');
  ctl.append('button').attr('class', 'btn iconbtn').attr('type', 'button').attr('aria-label', 'Zoom in').text('+').on('click', () => svg.transition().duration(250).call(zoom.scaleBy, 2));
  ctl.append('button').attr('class', 'btn iconbtn').attr('type', 'button').attr('aria-label', 'Zoom out').text('−').on('click', () => svg.transition().duration(250).call(zoom.scaleBy, 0.5));
  function placePin(){
    if (!sel){ pin.attr('display', 'none'); return; }
    const xy = proj([sel.lon, sel.lat]); pin.attr('display', null).attr('transform', `translate(${xy}) scale(${1/k})`);
  }
  function flyTo(geo, maxK = 60){
    const [[x0, y0], [x1, y1]] = path.bounds(geo);
    const kk = Math.max(1, Math.min(maxK, 0.8 / Math.max((x1 - x0) / W, (y1 - y0) / H)));
    const t = d3.zoomIdentity.translate(W/2, H/2).scale(kk).translate(-(x0 + x1)/2, -(y0 + y1)/2);
    svg.transition().duration(reduceMotion ? 0 : 600).call(zoom.transform, t);
  }
  function setPoint(lon, lat, name, zoomTo){
    const l = locate(lon, lat);
    sel = { id:(sel && sel.id) || uid('d'), name:'', lon:+lon.toFixed(4), lat:+lat.toFixed(4), country:l.country?.key || null, countryName:l.country?.name || '', state:l.state?.id || null, stateName:l.state?.name || '' };
    if (name && !nameTouched) nameIn.value = name;
    if (!name && !nameTouched) nameIn.value = '';
    placePin(); refresh();
    if (zoomTo) flyTo({ type:'Feature', geometry:{ type:'Point', coordinates:[lon, lat] } }, zoomTo);
  }
  function refresh(){
    cPaths.classed('focus', f => sel && f.key === sel.country);
    if (!sel){ info.textContent = 'No location picked yet.'; ok.disabled = true; return; }
    const where = [sel.stateName, sel.countryName].filter(Boolean).join(', ');
    info.innerHTML = where ? `📍 In <b>${esc(where)}</b>` : '📍 This spot isn’t inside a country — try tapping closer to land.';
    ok.disabled = !where || !nameIn.value.trim();
    if (where && !nameIn.value.trim()) info.innerHTML += '<br>Give this stop a name to add it.';
  }
  svg.on('click', ev => {
    const [x, y] = d3.zoomTransform(svg.node()).invert(d3.pointer(ev, svg.node()));
    const ll = proj.invert([x, y]); if (!ll) return;
    nameTouched = nameTouched && !!nameIn.value.trim();
    setPoint(ll[0], ll[1], null);
    if (!nameIn.value.trim()) nameIn.focus();
  });
  // search: cities, countries, states
  let cities = null; loadCities().then(c => { cities = c; if (q.value) search(); }).catch(() => {});
  const search = () => {
    const term = slug(q.value);
    if (!term){ res.innerHTML = ''; return; }
    const out = [];
    for (const f of G.countries) if (slug(f.name).startsWith(term)) out.push({ kind:'country', label:f.name, sub:'Country', f });
    for (const s of G.states) if (slug(s.name).startsWith(term)) out.push({ kind:'state', label:s.name, sub:'US state', f:s });
    if (cities){
      let n = 0;
      for (const c of cities){ if (c.s.startsWith(term)){ out.push({ kind:'city', label:c.n, sub:[c.cc === 'US' ? US_POSTAL[c.adm] : '', G.meta.countryNameByA2[c.cc] || c.cc].filter(Boolean).join(', '), c }); if (++n > 12) break; } }
    } else out.push({ kind:'wait', label:'Loading cities…', sub:'' });
    res.innerHTML = out.slice(0, 16).map((o, i) => `<li><button type="button" data-i="${i}" ${o.kind === 'wait' ? 'disabled' : ''}>${esc(o.label)}<small>${esc(o.sub)}</small></button></li>`).join('') || '<li class="sub" style="padding:8px">No matches. Tap the map instead.</li>';
    res.querySelectorAll('button[data-i]').forEach(b => b.onclick = () => {
      const o = out[+b.dataset.i];
      res.querySelectorAll('button').forEach(x => x.classList.remove('sel')); b.classList.add('sel');
      if (o.kind === 'city'){ nameTouched = false; setPoint(o.c.lon, o.c.lat, o.c.n, 40); }
      else {
        // zoom to the region; user taps the map to place a specific pin, or we use its centre
        flyTo(o.kind === 'country' ? mainGeometry(o.f) : o.f, 40);
        const c = d3.geoCentroid(o.kind === 'country' ? mainGeometry(o.f) : o.f);
        nameTouched = false; setPoint(c[0], c[1], o.label);
        info.innerHTML += '<br><span class="sub">Tap the map to move the pin to an exact spot.</span>';
      }
    });
  };
  q.addEventListener('input', debounce(search, 100));
  q.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); const b = res.querySelector('button[data-i]'); if (b) b.click(); } });
  ok.onclick = () => { if (!sel) return; sel.name = nameIn.value.trim(); onDone(sel); close(); };
  // starting view
  if (sel){ placePin(); refresh(); flyTo({ type:'Feature', geometry:{ type:'Point', coordinates:[sel.lon, sel.lat] } }, 30); }
  else if (near){ const f = G.byKey.get(near.country); if (f) flyTo(mainGeometry(f), 20); }
  setTimeout(() => q.focus(), 30);
}

/* ---------- backup & restore ---------- */
function syncSectionHTML(){
  if (!Sync.enabled()) return `
    <p style="margin:0">Save your trips and photos to a <b>private GitHub repository</b>. Everything then syncs automatically: nothing gets lost if a phone does, and Tommy’s and Katherine’s phones share one atlas.</p>
    <details class="howto"><summary>How to set it up (about 5 minutes, easiest on a computer)</summary>
      <ol>
        <li>On GitHub, create a <b>new repository</b>, e.g. <code>trip-atlas-data</code>. Choose <b>Private</b> and tick <b>Add a README file</b>. (Keep it separate from the repository that hosts this app, which is public.)</li>
        <li>Make an access token: GitHub → your photo → <b>Settings</b> → <b>Developer settings</b> → <b>Personal access tokens</b> → <b>Fine-grained tokens</b> → <b>Generate new token</b>.
          <ul><li>Expiration: the longest you’re allowed.</li><li>Repository access: <b>Only select repositories</b> → your data repository.</li><li>Permissions → Repository permissions → <b>Contents: Read and write</b>.</li></ul>
          Generate it and copy the token (it starts with <code>github_pat_</code>).</li>
        <li>Enter your GitHub username, the repository name and the token below, then tap Connect. Do the same on the other phone. You can use the same token on both.</li>
      </ol>
      <p class="sub">The token is stored only on this phone. Never put it in the app’s repository. If a phone is lost, delete the token on GitHub and make a new one.</p>
    </details>
    <form id="syncForm" class="syncform" novalidate>
      <div class="field"><label for="sOwner">GitHub username</label><input type="text" id="sOwner" autocomplete="off" autocapitalize="off" spellcheck="false" required></div>
      <div class="field"><label for="sRepo">Private repository name</label><input type="text" id="sRepo" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="trip-atlas-data" required></div>
      <div class="field"><label for="sToken">Access token</label><input type="password" id="sToken" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_…" required></div>
      <button class="btn primary" type="submit" id="sConnect">Connect</button>
      <div class="err" id="sErr" role="alert"></div>
    </form>`;
  const st = Sync.state || {};
  const pending = (st.dirty || []).length + (st.deleted || []).length + (st.photoDeletes || []).length;
  const line = { idle:`Synced ${st.lastSync ? timeAgo(st.lastSync) : ''}`, syncing:'Syncing now…', offline:'Offline. Changes will sync when you’re back online.', error:'Couldn’t sync' }[Sync.status] || '';
  return `
    <div class="syncstate" data-state="${Sync.status}"><span class="sdot"></span><div><b>${esc(line)}</b>
      <div class="sub">Connected to <b>${esc(Sync.cfg.owner)}/${esc(Sync.cfg.repo)}</b>${pending ? ` · ${pending} change${pending === 1 ? '' : 's'} waiting to upload` : ''}</div>
      ${Sync.status === 'error' ? `<div class="err">${esc(Sync.error)}</div>` : ''}</div></div>
    <p class="sub" style="margin:0">Trips and photos sync on their own whenever you open the app or change something. Photos added on the other phone download the first time you view them.</p>
    <div class="formactions"><button class="btn primary sm" data-syncnow ${Sync.status === 'syncing' ? 'disabled' : ''}>Sync now</button>
      <button class="btn sm" data-synctoken>Change token</button>
      <button class="btn sm ghost danger" data-syncoff>Disconnect</button></div>`;
}
function openBackup(){
  const m = document.createElement('div'); m.className = 'modal'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true'); m.setAttribute('aria-labelledby', 'bkTitle');
  const last = +(lsGet('tripatlas.lastBackup') || 0);
  m.innerHTML = `<div class="box" style="max-width:560px;height:auto">
    <div class="mh"><h2 id="bkTitle">Sync &amp; backup</h2><button class="btn iconbtn ghost" data-x aria-label="Close">✕</button></div>
    <div style="padding:18px;display:flex;flex-direction:column;gap:16px;overflow:auto">
      <section class="syncsec"><h3 class="sech">GitHub sync</h3><div id="syncSec"></div></section>
      <details class="backupsec"><summary class="sech">Backup file (optional)</summary>
      <div style="display:flex;flex-direction:column;gap:14px;margin-top:12px">
      <p style="margin:0" class="sub">A single file with every trip and photo. Handy for a one-off copy, or to move trips into a new browser without GitHub.</p>

        <div class="sub" style="margin-top:6px" id="bkInfo">${Store.trips.length} trip${Store.trips.length === 1 ? '' : 's'} · last backup: ${last ? new Date(last).toLocaleDateString() : 'never'}</div></div>

        <div class="sub" style="margin-top:6px">Restoring adds the backup’s trips to this browser (and to GitHub, if sync is on). Trips with the same ID get replaced.</div></div>
      <div class="sub" id="bkUsage"></div></div></details>
      <div class="sub" style="border-top:1px solid var(--line);padding-top:12px;font-size:12px">Map data: Natural Earth (public domain) via world-atlas and us-atlas. City search: GeoNames (CC BY 4.0). Maps drawn with D3.</div>
    </div></div>`;
  const drawSync = () => {
    const sec = $('#syncSec', m); if (!sec) return;
    const keepOpen = sec.querySelector('details.howto')?.open;
    sec.innerHTML = syncSectionHTML();
    if (keepOpen) sec.querySelector('details.howto').open = true;
    const form = $('#syncForm', sec);
    if (form){
      const prev = Sync.cfg || JSON.parse(lsGet('tripatlas.syncHint') || '{}');
      if (prev.owner) $('#sOwner', sec).value = prev.owner;
      if (prev.repo) $('#sRepo', sec).value = prev.repo;
      form.addEventListener('submit', async e => {
        e.preventDefault();
        const owner = $('#sOwner', sec).value, repo = $('#sRepo', sec).value, token = $('#sToken', sec).value;
        const err = $('#sErr', sec);
        if (!owner.trim() || !repo.trim() || !token.trim()){ err.textContent = 'Fill in all three fields.'; return; }
        const btn = $('#sConnect', sec); btn.disabled = true; btn.textContent = 'Connecting…'; err.textContent = '';
        try {
          lsSet('tripatlas.syncHint', JSON.stringify({ owner:owner.trim(), repo:repo.trim() }));
          await Sync.connect({ owner, repo, token });
          toast('Connected — your trips are syncing'); drawSync();
        } catch(ex){ err.textContent = ex.message || 'Couldn’t connect.'; btn.disabled = false; btn.textContent = 'Connect'; }
      });
    }
    sec.querySelector('[data-syncnow]')?.addEventListener('click', () => Sync.run());
    sec.querySelector('[data-syncoff]')?.addEventListener('click', () => confirmBox('Disconnect GitHub sync?', 'Trips stay on this phone and in the repository, but they’ll stop syncing until you connect again.', 'Disconnect', async () => { await Sync.disconnect(); drawSync(); }));
    sec.querySelector('[data-synctoken]')?.addEventListener('click', async () => { const c = Sync.cfg; await Sync.disconnect(); lsSet('tripatlas.syncHint', JSON.stringify({ owner:c.owner, repo:c.repo })); drawSync(); $('#sToken', m)?.focus(); });
  };
  drawSync();
  Sync.onStatus = drawSync;
  document.body.appendChild(m);
  const close = () => { m.remove(); Sync.onStatus = null; document.removeEventListener('keydown', onEsc); };
  const onEsc = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onEsc);
  m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-x]')) close(); });
  if (navigator.storage && navigator.storage.estimate) navigator.storage.estimate().then(est => {
    const mb = (n) => (n / 1048576).toFixed(n > 1048576 * 100 ? 0 : 1) + ' MB';
    $('#bkUsage', m).textContent = `Using ${mb(est.usage || 0)} of about ${mb(est.quota || 0)} available in this browser.`;
  }).catch(() => {});
  $('#bkExport', m).addEventListener('click', async (e) => {
    const b = e.currentTarget; b.disabled = true; b.textContent = 'Preparing…';
    try {
      const data = await Store.exportAll();
      const blob = new Blob([JSON.stringify(data)], { type:'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = `trip-atlas-backup-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      lsSet('tripatlas.lastBackup', String(Date.now()));
      $('#bkInfo', m).textContent = `${Store.trips.length} trip${Store.trips.length === 1 ? '' : 's'} · last backup: today`;
      toast('Backup downloaded');
    } catch(ex){ toast('Could not make the backup'); }
    b.disabled = false; b.textContent = 'Download backup';
  });
  $('#bkFile', m).addEventListener('change', async (e) => {
    const f = e.target.files[0]; if (!f) return;
    const lbl = m.querySelector('label[for=bkFile]'); lbl.textContent = 'Restoring…';
    try { const n = await Store.importAll(JSON.parse(await f.text())); lsSet('tripatlas.lastBackup', String(Date.now())); toast(`Restored ${n} trip${n === 1 ? '' : 's'}`); close(); render(true); }
    catch(ex){ toast(ex && ex.message && ex.message.includes('Trip Atlas') ? ex.message : 'Could not read that backup file'); }
    lbl.textContent = 'Restore from a backup…'; e.target.value = '';
  });
  ($('#sOwner', m) || $('[data-syncnow]', m) || $('#bkExport', m)).focus({ preventScroll:true });
}
// sync again when the app comes back to the foreground or the phone reconnects
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') Sync.schedule(300); });
window.addEventListener('online', () => Sync.schedule(300));
setInterval(() => { if (document.visibilityState === 'visible') Sync.schedule(0); }, 4 * 60 * 1000);
$('#backupBtn').addEventListener('click', openBackup);
document.addEventListener('click', e => { const a = e.target.closest('[data-backup]'); if (a){ e.preventDefault(); openBackup(); } });

/* ================= boot ================= */
$('#brand').addEventListener('click', () => go('world'));
window.addEventListener('hashchange', () => {
  if (formDirty && !confirmLeave()) return;
  formDirty = false; render(true);
});
let lastHash = location.hash;
function confirmLeave(){
  // A route change away from an unsaved form: bounce back and ask.
  const target = location.hash;
  history.replaceState(null, '', lastHash || '#world');
  confirmBox('Leave without saving?', 'Your changes to this trip will be lost.', 'Leave', () => { formDirty = false; location.hash = target; });
  return false;
}
window.addEventListener('hashchange', () => { lastHash = location.hash; });
let lastW = innerWidth, lastH = innerHeight;
window.addEventListener('resize', debounce(() => {
  if (Math.abs(innerWidth - lastW) < 2 && Math.abs(innerHeight - lastH) < 120) return; // ignore mobile URL-bar jiggle
  lastW = innerWidth; lastH = innerHeight;
  const v = parseRoute().view; if (v !== 'form' && v !== 'trip') render(true);
}, 200));
Store.listeners.add(() => { if (G.ready) { reindex(); render(); } });
render(true);
loadGeo().then(() => { reindex(); render(true); }).catch(e => { $('#stage').innerHTML = location.protocol === 'file:' ? '<div class="loading" style="padding:20px;text-align:center">Trip Atlas needs to be served from a web address, not opened as a file.<br>See the README for how to run it locally or on GitHub Pages.</div>' : '<div class="loading">The map couldn’t load. Refresh to try again.</div>'; console.error(e); });
Store.init();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
})();
</script>
