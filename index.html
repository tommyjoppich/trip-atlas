<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trip Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="d3.min.js"></script>
<script src="topojson-client.min.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1d5c63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Trip Atlas">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="description" content="A personal travel map: track your trips, photos and notes on a globe.">
<style>
:root{
  --paper:#f5f0e6; --paper-2:#ece5d6; --card:#fffdf8; --ink:#1e2a2f; --ink-2:#56636a; --line:#d9d0bf;
  --ocean:#d6e4e6; --ocean-2:#c3d7da; --land:#e8e0cf; --land-muted:#efe9dc; --border:#b9ad96;
  --visited:#d9693a; --visited-2:#ec9a72; --accent:#1d5c63; --accent-2:#2b7c85; --danger:#b3392f;
  --radius:14px; --shadow:0 1px 2px rgba(30,42,47,.06),0 6px 20px rgba(30,42,47,.08);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100dvh;display:flex;flex-direction:column}
body{background:var(--paper);color:var(--ink);font:16px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.brand{font-family:Fraunces,Georgia,serif;font-weight:650;letter-spacing:-.01em}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--accent-2);outline-offset:2px;border-radius:6px}

/* ---------- top bar ---------- */
.appbar{position:sticky;top:0;z-index:30;background:rgba(245,240,230,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:12px;padding:calc(10px + var(--sat)) calc(16px + var(--sar)) 10px calc(16px + var(--sal))}
.ownerbar{display:flex;gap:6px;align-items:center;overflow-x:auto;padding:0 calc(16px + var(--sar)) 10px calc(16px + var(--sal));scrollbar-width:none}
.ownerbar::-webkit-scrollbar{display:none}
.ownerbar[hidden]{display:none}
.ownerbar .obl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);font-weight:600;margin-right:4px;white-space:nowrap}
.ochip{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:0 12px;border-radius:999px;border:1.5px solid var(--c);background:var(--card);cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap;flex:none}
.ochip i{width:12px;height:12px;border-radius:50%;background:var(--c);border:2px solid var(--c);box-sizing:border-box}
.ochip .cnt{font-size:12px;color:var(--ink-2)}
.ochip[aria-pressed=false]{border-color:var(--line);background:transparent;color:var(--ink-2)}
.ochip[aria-pressed=false] i{background:transparent}
.tripmeta .o{margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.own{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--ink);margin-right:10px;white-space:nowrap}
.own::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--c)}
.routecard{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.rchead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line)}
.rchead h2{margin:0;font-size:20px}
.routemap{position:relative;height:400px;background:var(--ocean)}
.routemap svg{display:block;width:100%;height:100%;touch-action:auto}
.orow{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.orow input[type=text]{min-height:42px;border-radius:10px;border:1px solid var(--line);padding:0 10px;font-size:16px;width:100%}
.swatches{grid-column:1 / -1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.swatches button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;box-shadow:inset 0 0 0 2px #fff}
.swatches button[aria-pressed=true]{border-color:var(--ink)}
.swatches input[type=color]{width:34px;height:34px;border:0;padding:0;background:none;cursor:pointer}
.opick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.sech{font:600 12px Inter,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);margin:0 0 10px;cursor:pointer}
.syncsec #syncSec{display:flex;flex-direction:column;gap:12px}
.howto{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:#fff;font-size:14px}
.howto summary{font-weight:600;cursor:pointer}
.howto ol{padding-left:20px;margin:10px 0}.howto li{margin-bottom:8px}.howto ul{padding-left:18px;margin:6px 0}
.howto code{background:var(--paper-2);padding:1px 5px;border-radius:5px;font-size:13px}
.syncform{display:flex;flex-direction:column;gap:12px}
.syncform .field input{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:#fff;padding:10px 12px;font-size:16px}
.syncstate{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;background:#eef5f3}
.syncstate[data-state=error]{background:#fbeceb}.syncstate[data-state=offline]{background:#fff4e5}
.sdot,#backupBtn::after{width:10px;height:10px;border-radius:50%;background:var(--sync,#9aa3a6);flex:none;margin-top:5px}
[data-state=idle]{--sync:#2e9a56}[data-state=syncing]{--sync:#2563c9}[data-state=offline]{--sync:#c99a12}[data-state=error]{--sync:#b3392f}
#backupBtn{position:relative}
#backupBtn::after{content:'';position:absolute;top:6px;right:6px;width:8px;height:8px;margin:0;box-shadow:0 0 0 2px var(--paper)}
#backupBtn[data-state=off]::after{display:none}
#backupBtn[data-state=syncing]::after{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.backupsec summary{list-style:revert}
.ochip.big{min-height:44px;padding:0 18px;font-size:16px}
.pickhint{align-self:center;font-size:13px;font-weight:600;color:var(--c);margin-left:4px}
.heatlegend{position:absolute;left:12px;top:12px;z-index:3;display:grid;grid-template-columns:auto 96px;gap:5px 10px;align-items:center;
  background:rgba(255,253,248,.92);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:12px;color:var(--ink);box-shadow:var(--shadow)}
.hk-name{font-weight:600}
.hk-ramp{display:block;height:10px;border-radius:5px}
.hk-scale{display:flex;justify-content:space-between;color:var(--ink-2);font-size:11px}
.brand{font-size:21px;margin:0;display:flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap;background:none;border:0;padding:0}
.brand svg{flex:none}
.crumbs{display:flex;align-items:center;gap:4px;min-width:0;overflow:hidden;font-size:14px;color:var(--ink-2)}
.crumbs a{color:var(--ink-2);text-decoration:none;padding:4px 6px;border-radius:8px;white-space:nowrap}
.crumbs a:hover{background:var(--paper-2);color:var(--ink)}
.crumbs .cur{color:var(--ink);font-weight:600;padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs .sep{opacity:.5}
.spacer{flex:1}
.stats{display:flex;gap:14px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.stats b{color:var(--ink);font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border-radius:999px;
  border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;font-size:15px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--border)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2)}
.btn.danger{color:var(--danger)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn[disabled]{opacity:.55;cursor:default}
.iconbtn{width:42px;height:42px;padding:0;border-radius:50%}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:minmax(300px,360px) 1fr;flex:1;min-height:0;height:0}
@media (min-width:821px){body{height:100dvh}}
.panel{border-right:1px solid var(--line);overflow:auto;padding:18px 16px calc(24px + var(--sab)) calc(16px + var(--sal));background:var(--paper)}
.stage{position:relative;overflow:hidden;background:var(--ocean)}
.stage.globe-bg{background:radial-gradient(ellipse at 50% 45%,#f9f5ec 0%,#efe8da 60%,#e6ddca 100%)}
.stage svg{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.stage canvas{display:block;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.stage svg.overlay{position:absolute;inset:0;pointer-events:none}
.stage svg.overlay .pin{pointer-events:auto}
.stage.full{grid-column:1 / -1;overflow:auto;background:var(--paper)}
.panel h2{font-size:24px;margin:0 0 2px}
.panel .sub{color:var(--ink-2);font-size:14px;margin:0 0 14px}
.panel h3{font-family:Inter,sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);margin:20px 0 8px;font-weight:600}

/* search */
.search{position:relative;margin:6px 0 12px}
.search input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 12px 0 38px}
.search svg{position:absolute;left:12px;top:13px;color:var(--ink-2)}

/* trip list */
.triplist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tripitem{overflow:hidden;display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px;border-radius:12px;border:1px solid transparent;background:var(--card);cursor:pointer;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.tripitem:hover,.tripitem.hot{border-color:var(--border)}
.thumb{flex:none;width:58px;height:58px;border-radius:10px;background:var(--paper-2) center/cover no-repeat;display:grid;place-items:center;color:var(--ink-2);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.tripmeta{min-width:0;flex:1;display:block}
.tripmeta>span{display:block}
.tripmeta .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tripmeta .d{font-size:13px;color:var(--ink-2)}
.tripmeta .r{font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:#e6efe9;color:var(--accent);margin-left:6px;vertical-align:1px}
.empty{padding:18px;border:1.5px dashed var(--border);border-radius:var(--radius);color:var(--ink-2);text-align:center;font-size:15px}
.empty .btn{margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;cursor:pointer;color:var(--ink);text-decoration:none}
.chip:hover{border-color:var(--border)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--visited)}
.chip.off .dot{background:var(--line)}

/* map */
.country{fill:var(--land);stroke:var(--border);stroke-width:.6px;vector-effect:non-scaling-stroke;transition:fill .15s}
.country.visited{fill:var(--visited-2)}
.country.muted{fill:var(--land-muted);stroke:#d6ccb8}
.country.muted.visited{fill:#f1c6ae}
.country.clickable{cursor:pointer}
.country.hl{fill:#d9cfba}
.country.visited.hl{fill:var(--visited);filter:brightness(.9)}
.country.focus{fill:#e1d6bf;stroke:var(--ink);stroke-width:1.4px}
.country.focus.visited{fill:var(--visited-2)}
.state{fill:transparent;stroke:#b9ad96;stroke-width:.5px;vector-effect:non-scaling-stroke}
.state.visited{fill:var(--visited-2)}
.state.clickable{cursor:pointer;fill:var(--land)}
.state.clickable.visited{fill:var(--visited-2)}
.state.clickable:hover,.state.clickable.hl{fill:#d9cfba}
.state.clickable.visited:hover{fill:var(--visited);filter:brightness(.92)}
.sphere{fill:url(#oceanGrad);stroke:#a9bfc2;stroke-width:1px}
.grat{fill:none;stroke:#fff;stroke-opacity:.45;stroke-width:.5px}
.pin circle{fill:var(--accent);stroke:#fff;stroke-width:2px;vector-effect:non-scaling-stroke;cursor:pointer}
.pin.hot circle{stroke:var(--ink);stroke-width:3px}
.pin.away circle{stroke-width:2.5px}
.pin .num{font:700 11px Inter,sans-serif;fill:#fff;stroke:none;text-anchor:middle;pointer-events:none}
.pin text{font:600 12px Inter,sans-serif;fill:var(--ink);paint-order:stroke;stroke:#fffdf8;stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
.route{fill:none;stroke:var(--accent);stroke-width:2px;stroke-dasharray:5 5;vector-effect:non-scaling-stroke;opacity:.75}
.route.hot{stroke-width:3.5px;opacity:1}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:13px;padding:6px 10px;border-radius:8px;transform:translate(-50%,calc(-100% - 12px));white-space:nowrap;opacity:0;transition:opacity .12s;z-index:5}
.tip.on{opacity:1}
.mapctl{position:absolute;right:calc(14px + var(--sar));bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:4}
.mapctl .btn{box-shadow:var(--shadow)}
.maphint{position:absolute;left:14px;bottom:14px;font-size:13px;color:var(--ink-2);background:rgba(255,253,248,.85);padding:6px 10px;border-radius:999px;z-index:3;max-width:calc(100% - 90px)}
.legend{position:absolute;left:14px;top:14px;display:flex;gap:12px;font-size:12px;color:var(--ink-2);background:rgba(255,253,248,.85);padding:6px 10px;border-radius:999px;z-index:3}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-2)}
.banner{margin:0 0 12px;padding:10px 12px;border-radius:10px;background:#fff4e5;border:1px solid #f1d3a8;font-size:14px}

/* ---------- trip page ---------- */
.page{max-width:1100px;margin:0 auto;padding:22px calc(18px + var(--sar)) calc(40px + var(--sab)) calc(18px + var(--sal))}
.pagehead{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.pagehead h1{font-size:34px;line-height:1.1;margin:0;flex:1;min-width:220px}
.tripcard{display:grid;grid-template-columns:340px 1fr;gap:0;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.tripinfo{order:1;padding:22px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px}
.tripinfo .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);font-weight:600;margin-bottom:6px}
.tripinfo .dates{font-family:Fraunces,serif;font-size:20px}
.notes{white-space:pre-wrap;font-size:15px}
.gallery{order:2;position:relative;background:#1b2327;min-height:460px;display:flex;flex-direction:column}
.gallery .frame{position:relative;flex:1;display:grid;place-items:center;overflow:hidden;touch-action:pan-y}
.gallery .frame img{max-width:100%;max-height:70vh;object-fit:contain;display:block;cursor:zoom-in}
.gallery .nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.88);cursor:pointer;display:grid;place-items:center;box-shadow:var(--shadow)}
.gallery .nav.prev{left:12px}.gallery .nav.next{right:12px}
.gallery .bar{display:flex;align-items:center;gap:10px;padding:10px 14px;color:#e9e4da;font-size:14px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots button{width:9px;height:9px;padding:0;border-radius:50%;border:0;background:rgba(255,255,255,.35);cursor:pointer}
.dots button.on{background:#fff}
.gallery .cap{flex:1;text-align:right;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gallery .none{color:#cfc8bb;text-align:center;padding:40px}
.lightbox{position:fixed;inset:0;background:rgba(10,14,16,.94);z-index:100;display:grid;place-items:center}
.lightbox img{max-width:96vw;max-height:90vh;object-fit:contain}
.lightbox .x{position:absolute;top:calc(12px + var(--sat));right:12px}

/* ---------- form ---------- */
.form{display:flex;flex-direction:column;gap:18px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
.field label,.field .lbl{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.field .hint{font-weight:400;color:var(--ink-2);font-size:13px}
.field input[type=text],.field input[type=date],.field textarea,.field input[type=search]{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:#fff;padding:10px 12px;font-size:16px}
.field textarea{min-height:120px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row2>*,.field{min-width:0}
.field input[type=date]{-webkit-appearance:none;appearance:none;display:block;width:100%;max-width:100%;min-width:0;line-height:24px;text-align:left}
.field input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
.field input[type=date]::-webkit-calendar-picker-indicator{margin-left:auto}
.dests{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.dest{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:#fff}
.dest .n{font-weight:600}.dest .w{font-size:13px;color:var(--ink-2)}
.dest .grow{flex:1;min-width:0}
.dest .num{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:600;flex:none}
.friendbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:46px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:6px 8px}
.friendbox input{border:0;outline:0;flex:1;min-width:140px;height:32px;font-size:16px;background:transparent}
.field .friendbox input[type=text]{border:0;min-height:32px;padding:0 4px;border-radius:0}
.friendbox .chip{min-height:30px;cursor:default}
.friendbox .chip button{border:0;background:none;padding:0 0 0 2px;cursor:pointer;font-size:16px;line-height:1;color:var(--ink-2)}
.drop{border:1.5px dashed var(--border);border-radius:14px;padding:18px;text-align:center;color:var(--ink-2);background:#fffcf6}
.drop.over{background:#eef5f3;border-color:var(--accent)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px}
.ph{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#fff}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--paper-2)}
.ph input{width:100%;border:0;border-top:1px solid var(--line);padding:8px;font-size:14px;min-height:38px}
.ph .tools{position:absolute;top:6px;right:6px;display:flex;gap:4px}
.ph .tools button{width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.92);cursor:pointer;display:grid;place-items:center;font-size:15px}
.ph .cover{position:absolute;left:6px;top:6px;background:var(--accent);color:#fff;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px}
.formactions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.err{color:var(--danger);font-size:14px}
.progress{font-size:14px;color:var(--ink-2)}

/* modal */
.modal{position:fixed;inset:0;z-index:90;background:rgba(20,26,28,.5);display:grid;place-items:center;padding:16px}
.modal .box{background:var(--card);border-radius:18px;width:min(980px,100%);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal .mh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.modal .mh h2{margin:0;font-size:20px;flex:1}
.picker{display:grid;grid-template-columns:320px 1fr;min-height:0;flex:1}
.picker .side{padding:14px;border-right:1px solid var(--line);overflow:auto;display:flex;flex-direction:column;gap:12px}
.picker .mapwrap{position:relative;min-height:420px;background:var(--ocean);overflow:hidden}
.results{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;max-height:260px;overflow:auto}

<script>
(() => {
'use strict';
/* ================= helpers ================= */
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug = (s) => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const uid = (p='t') => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const isNarrow = () => innerWidth <= 820;
const lsGet = (k) => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch(e){} };
function toast(msg, ms = 2600){ const t = document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }
const ICON = {
  search:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  pin:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  left:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>',
  right:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>',
};
const fmtDate = (d) => d ? new Date(d + 'T12:00:00').toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'}) : '';
function fmtRange(a, b){
  if (!a && !b) return 'No dates';
  if (!b || a === b) return fmtDate(a || b);
  if (!a) return fmtDate(b);
  const A = new Date(a+'T12:00:00'), B = new Date(b+'T12:00:00');
  if (A.getFullYear() === B.getFullYear()){
    const s = A.toLocaleDateString(undefined,{month:'short',day:'numeric'});
    const e = A.getMonth() === B.getMonth() ? B.getDate() : B.toLocaleDateString(undefined,{month:'short',day:'numeric'});
    return `${s} – ${e}, ${B.getFullYear()}`;
  }
  return `${fmtDate(a)} – ${fmtDate(b)}`;
}

/* ================= geography ================= */
const CONTINENTS = {
  'north-america': { name:'North America', box:[[-168,7],[-52,72]] },
  'south-america': { name:'South America', box:[[-82,-56],[-34,13]] },
  'europe':        { name:'Europe',        box:[[-25,34],[45,71]] },
  'africa':        { name:'Africa',        box:[[-19,-35],[52,38]] },
  'asia':          { name:'Asia',          box:[[26,-11],[146,56]] },
  'oceania':       { name:'Oceania',       box:[[110,-48],[185,-1]] },
  'antarctica':    { name:'Antarctica',    box:null },
};
const EXTRA_CONT = { 'Somaliland':'africa', 'Kosovo':'europe', 'N. Cyprus':'europe', 'Indian Ocean Ter.':'oceania', 'Siachen Glacier':'asia' };
const NICE_NAME = { 'United States of America':'United States', 'Dem. Rep. Congo':'DR Congo', 'Central African Rep.':'Central African Republic', 'Dominican Rep.':'Dominican Republic', 'Bosnia and Herz.':'Bosnia and Herzegovina', 'Czechia':'Czechia', 'S. Sudan':'South Sudan', 'Eq. Guinea':'Equatorial Guinea', 'Solomon Is.':'Solomon Islands', 'Marshall Is.':'Marshall Islands', 'Falkland Is.':'Falkland Islands', 'Faeroe Is.':'Faroe Islands', 'Cayman Is.':'Cayman Islands', 'Cook Is.':'Cook Islands', 'Fr. Polynesia':'French Polynesia', 'W. Sahara':'Western Sahara', "Côte d'Ivoire":"Côte d'Ivoire", 'N. Mariana Is.':'Northern Mariana Islands', 'U.S. Virgin Is.':'U.S. Virgin Islands', 'British Virgin Is.':'British Virgin Islands', 'Turks and Caicos Is.':'Turks and Caicos', 'St. Vin. and Gren.':'St. Vincent and the Grenadines', 'Antigua and Barb.':'Antigua and Barbuda', 'São Tomé and Principe':'São Tomé and Príncipe', 'Fr. S. Antarctic Lands':'French Southern Lands', 'Heard I. and McDonald Is.':'Heard and McDonald Islands', 'S. Geo. and the Is.':'South Georgia', 'St. Pierre and Miquelon':'St. Pierre and Miquelon', 'Wallis and Futuna Is.':'Wallis and Futuna', 'Br. Indian Ocean Ter.':'British Indian Ocean Territory', 'N. Cyprus':'Northern Cyprus' };
const G = { ready:false, countries:[], byKey:new Map(), states:[], stateById:new Map(), meta:null, cities:null, usKey:'c-840' };

async function loadGeo(){
  const get = u => fetch(u).then(r => { if (!r.ok) throw new Error(u); return r.json(); });
  const [world, us, meta] = await Promise.all(['countries-50m.json','states-10m.json','meta.json'].map(get));
  // lighter shapes used while the globe is moving (optional: falls back to full detail)
  const lite = Promise.all(['countries-110m.json','states-lite.json'].map(get)).catch(() => null);
  G.meta = meta;
  G.countries = topojson.feature(world, world.objects.countries).features.filter(f => f.geometry);
  for (const f of G.countries){
    const raw = f.properties.name;
    f.key = 'c-' + (f.id ? f.id : slug(raw));
    f.name = NICE_NAME[raw] || raw;
    f.cont = (f.id && meta.continentByNum[f.id]) || EXTRA_CONT[raw] || 'asia';
    f.bounds = d3.geoBounds(f);
    G.byKey.set(f.key, f);
  }
  G.states = topojson.feature(us, us.objects.states).features;
  for (const s of G.states){ s.key = 's-' + s.id; s.name = s.properties.name; s.bounds = d3.geoBounds(s); G.stateById.set(s.id, s); }
  G.statesMesh = topojson.mesh(us, us.objects.states, (a,b) => a !== b);
  G.nation = topojson.feature(us, us.objects.nation);
  G.worldMesh = topojson.mesh(world, world.objects.countries);
  G.worldLand = topojson.merge(world, world.objects.countries.geometries);
  const l = await lite;
  if (l){
    const [w110, sl] = l;
    const countries = topojson.feature(w110, w110.objects.countries).features.filter(f => f.geometry);
    for (const f of countries){ f.key = 'c-' + (f.id ? f.id : slug(f.properties.name)); f.cont = (G.byKey.get(f.key) || {}).cont; }
    const states = topojson.feature(sl, sl.objects.states).features;
    G.lite = { countries, states, land:topojson.merge(w110, w110.objects.countries.geometries), mesh:topojson.mesh(w110, w110.objects.countries), statesMesh:topojson.mesh(sl, sl.objects.states, (a, b) => a !== b) };
  }
  G.ready = true;
}
function inBounds(b, lon, lat){
  const [[x0,y0],[x1,y1]] = b;
  if (lat < y0 - .5 || lat > y1 + .5) return false;
  if (x0 <= x1) return lon >= x0 - .5 && lon <= x1 + .5;
  return lon >= x0 - .5 || lon <= x1 + .5; // crosses antimeridian
}
function findIn(list, lon, lat){
  for (const f of list) if (inBounds(f.bounds, lon, lat) && d3.geoContains(f, [lon, lat])) return f;
  return null;
}
/** Work out which country (and US state) a point is in. Nudges outward for coastal points. */
function locate(lon, lat){
  let c = findIn(G.countries, lon, lat);
  if (!c){
    outer: for (const r of [0.08, 0.2, 0.4, 0.7]) for (let a = 0; a < 360; a += 45){
      const p = [lon + r*Math.cos(a*Math.PI/180), lat + r*Math.sin(a*Math.PI/180)];
      c = findIn(G.countries, p[0], p[1]); if (c) break outer;
    }
  }
  let s = null;
  if (c && c.key === G.usKey){
    s = findIn(G.states, lon, lat);
    if (!s) outer2: for (const r of [0.08, 0.2, 0.4, 0.7]) for (let a = 0; a < 360; a += 45){
      s = findIn(G.states, lon + r*Math.cos(a*Math.PI/180), lat + r*Math.sin(a*Math.PI/180)); if (s) break outer2;
    }
  }
  return { country:c, state:s };
}
async function loadCities(){
  if (G.cities) return G.cities;
  const raw = await fetch('cities.json').then(r => r.json());
  G.cities = raw.map(([n, lon, lat, cc, adm, pop]) => ({ n, lon, lat, cc, adm, pop, s: slug(n) }));
  return G.cities;
}
const US_POSTAL = {AL:'Alabama',AK:'Alaska',AZ:'Arizona',AR:'Arkansas',CA:'California',CO:'Colorado',CT:'Connecticut',DE:'Delaware',DC:'District of Columbia',FL:'Florida',GA:'Georgia',HI:'Hawaii',ID:'Idaho',IL:'Illinois',IN:'Indiana',IA:'Iowa',KS:'Kansas',KY:'Kentucky',LA:'Louisiana',ME:'Maine',MD:'Maryland',MA:'Massachusetts',MI:'Michigan',MN:'Minnesota',MS:'Mississippi',MO:'Missouri',MT:'Montana',NE:'Nebraska',NV:'Nevada',NH:'New Hampshire',NJ:'New Jersey',NM:'New Mexico',NY:'New York',NC:'North Carolina',ND:'North Dakota',OH:'Ohio',OK:'Oklahoma',OR:'Oregon',PA:'Pennsylvania',RI:'Rhode Island',SC:'South Carolina',SD:'South Dakota',TN:'Tennessee',TX:'Texas',UT:'Utah',VT:'Vermont',VA:'Virginia',WA:'Washington',WV:'West Virginia',WI:'Wisconsin',WY:'Wyoming',PR:'Puerto Rico'};

/* ================= storage =================
   Everything lives in this browser's IndexedDB: trip records in "trips",
   photo files (as Blobs) in "photos". Use Backup → Export to keep a copy. */
const Store = {
  trips:[], listeners:new Set(), loaded:false, error:null, dbp:null, urlCache:new Map(),
  open(){
    if (this.dbp) return this.dbp;
    this.dbp = new Promise((res, rej) => {
      if (!('indexedDB' in window)) return rej(new Error('This browser has no IndexedDB'));
      const r = indexedDB.open('trip-atlas', 2);
      r.onupgradeneeded = () => {
        const d = r.result;
        if (!d.objectStoreNames.contains('trips')) d.createObjectStore('trips', { keyPath:'id' });
        if (!d.objectStoreNames.contains('photos')) d.createObjectStore('photos');
        if (!d.objectStoreNames.contains('settings')) d.createObjectStore('settings');
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return this.dbp;
  },
  async tx(stores, mode, fn){
    const d = await this.open();
    return new Promise((res, rej) => {
      const t = d.transaction(stores, mode);
      let out;
      const req = fn(t);
      if (req && 'onsuccess' in req) req.onsuccess = () => { out = req.result; };
      t.oncomplete = () => res(out);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error || new Error('Saving was interrupted (storage may be full)'));
    });
  },
  async init(){
    let trips = [];
    try { trips = (await this.tx('trips', 'readonly', t => t.objectStore('trips').getAll())) || []; }
    catch(e){ this.error = e; }
    this.trips = trips;
    await Sync.load();
    this.loaded = true;
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
    this.emit();
    Sync.run();
  },
  emit(){ for (const f of this.listeners) f(); },
  getSetting(k){ return this.tx('settings', 'readonly', t => t.objectStore('settings').get(k)); },
  setSetting(k, v){ return this.tx('settings', 'readwrite', t => t.objectStore('settings').put(JSON.parse(JSON.stringify(v)), k)); },
  async save(trip){
    trip.updatedAt = Date.now();
    const copy = JSON.parse(JSON.stringify(trip));
    await this.tx('trips', 'readwrite', t => t.objectStore('trips').put(copy));
    const i = this.trips.findIndex(x => x.id === copy.id);
    if (i >= 0) this.trips[i] = copy; else this.trips.push(copy);
    this.emit();
    Sync.markDirty(copy.id);
  },
  async remove(id){
    await this.tx('trips', 'readwrite', t => t.objectStore('trips').delete(id));
    this.trips = this.trips.filter(t => t.id !== id);
    this.emit();
    Sync.markDeleted(id);
  },
  /* used by sync: write/remove without marking the change as ours, then re-read */
  putRaw(trip){ return this.tx('trips', 'readwrite', t => t.objectStore('trips').put(trip)); },
  removeRaw(id){ return this.tx('trips', 'readwrite', t => t.objectStore('trips').delete(id)); },
  async reload(){ this.trips = (await this.tx('trips', 'readonly', t => t.objectStore('trips').getAll())) || []; this.emit(); },
  getPhotoBlob(id){ return this.tx('photos', 'readonly', t => t.objectStore('photos').get(id)); },
  async uploadPhoto(file){
    const blob = await compressImage(file, 1800, 0.84);
    const id = uid('p');
    await this.tx('photos', 'readwrite', t => t.objectStore('photos').put(blob, id));
    return { id };
  },
  async photoSrc(p){
    if (!p || !p.id) return '';
    if (this.urlCache.has(p.id)) return this.urlCache.get(p.id);
    let b = null;
    try { b = await this.tx('photos', 'readonly', t => t.objectStore('photos').get(p.id)); } catch(e){}
    if (!b){ // added on the other phone: fetch it once from GitHub and keep a copy here
      b = await Sync.fetchPhoto(p.id);
      if (b) try { await this.tx('photos', 'readwrite', t => t.objectStore('photos').put(b, p.id)); } catch(e){}
    }
    if (!b) return '';
    const u = URL.createObjectURL(b);
    this.urlCache.set(p.id, u);
    return u;
  },
  async deletePhoto(p){
    if (!p || !p.id) return;
    try { await this.tx('photos', 'readwrite', t => t.objectStore('photos').delete(p.id)); } catch(e){}
    Sync.markPhotoDeleted(p.id);
    const u = this.urlCache.get(p.id); if (u){ URL.revokeObjectURL(u); this.urlCache.delete(p.id); }
  },
  /* backup: one JSON file with every trip and every photo (as data URLs) */
  async exportAll(){
    const photos = {};
    for (const t of this.trips) for (const p of t.photos || []){
      if (photos[p.id]) continue;
      const b = await this.tx('photos', 'readonly', x => x.objectStore('photos').get(p.id));
      if (b) photos[p.id] = await blobToDataURL(b);
    }
    return { app:'trip-atlas', version:2, exportedAt:new Date().toISOString(), trips:this.trips, photos };
  },
  async importAll(data){
    if (!data || data.app !== 'trip-atlas' || !Array.isArray(data.trips)) throw new Error('That file isn’t a Trip Atlas backup.');
    let n = 0;
    for (const [id, url] of Object.entries(data.photos || {})){
      const blob = await (await fetch(url)).blob();
      await this.tx('photos', 'readwrite', t => t.objectStore('photos').put(blob, id));
    }
    for (const trip of data.trips){
      if (!trip || typeof trip.id !== 'string' || !/^[A-Za-z0-9_-]+$/.test(trip.id)) continue;
      await this.tx('trips', 'readwrite', t => t.objectStore('trips').put(trip)); n++;
      Sync.markDirty(trip.id);
    }
    this.trips = (await this.tx('trips', 'readonly', t => t.objectStore('trips').getAll())) || [];
    this.emit();
    return n;
  },
};
function blobToDataURL(b){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); }); }
async function compressImage(file, max, q){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Could not read ' + file.name + ' (try JPG or PNG)')); i.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth*k); c.height = Math.round(img.naturalHeight*k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(res, 'image/jpeg', q));
  } finally { URL.revokeObjectURL(url); }
}
function setPhoto(img, p){ Store.photoSrc(p).then(src => { if (src) img.src = src; }); }

/* ================= GitHub sync =================
   Keeps trips and photos in a PRIVATE GitHub repository, so both phones share one atlas
   and nothing lives only on one device. Layout of that repository:
     trips/<trip id>.json   one file per trip
     photos/<photo id>.jpg  one file per photo
   Each device remembers which version (git "sha") of each file it last saw. On every sync it
   pulls files that changed, removes trips deleted elsewhere, then pushes its own changes.
   If the same trip was edited on both phones, the most recent edit wins. */
const Sync = {
  cfg:null, state:null, status:'off', error:'', running:false, again:false, timer:0,
  blank(){ return { trips:{}, photos:{}, dirty:[], deleted:[], photoDeletes:[], lastSync:0 }; },
  async load(){
    try { this.cfg = (await Store.getSetting('syncConfig')) || null; } catch(e){}
    try { this.state = (await Store.getSetting('syncState')) || this.blank(); } catch(e){ this.state = this.blank(); }
    this.setStatus(this.enabled() ? 'idle' : 'off');
  },
  enabled(){ return !!(this.cfg && this.cfg.token && this.cfg.owner && this.cfg.repo); },
  saveState(){ return Store.setSetting('syncState', this.state).catch(() => {}); },
  setStatus(s, err){ this.status = s; this.error = err || ''; renderSyncBadge(); if (this.onStatus) this.onStatus(); },
  onStatus:null,
  /* ---- change tracking (called by Store) ---- */
  markDirty(id){
    if (!this.state) return;
    if (!this.state.dirty.includes(id)) this.state.dirty.push(id);
    this.state.deleted = this.state.deleted.filter(x => x !== id);
    this.saveState(); this.schedule();
  },
  markDeleted(id){
    if (!this.state) return;
    this.state.dirty = this.state.dirty.filter(x => x !== id);
    if (this.state.trips[id] && !this.state.deleted.includes(id)) this.state.deleted.push(id);
    this.saveState(); this.schedule();
  },
  markPhotoDeleted(pid){
    if (!this.state) return;
    if (this.state.photos[pid] && !this.state.photoDeletes.includes(pid)) this.state.photoDeletes.push(pid);
    this.saveState(); this.schedule();
  },
  schedule(ms = 1200){ if (!this.enabled()) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.run(), ms); },
  /* ---- GitHub API ---- */
  async api(path, opts = {}){
    const { owner, repo, token } = this.cfg;
    const r = await fetch(`https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}${path}`, {
      cache:'no-store', ...opts,
      headers:{ Authorization:'Bearer ' + token, Accept:'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28', ...(opts.headers || {}) },
    });
    return r;
  },
  async fail(r, what){
    let msg = '';
    try { msg = (await r.json()).message || ''; } catch(e){}
    const e = new Error(r.status === 401 ? 'GitHub didn’t accept the token (it may have expired). Paste a new one in Sync settings.'
      : r.status === 403 ? 'The token isn’t allowed to change this repository. Check it has “Contents: Read and write”.'
      : r.status === 404 ? 'Repository not found. Check the name, and that the token can access it.'
      : `${what} failed (${r.status}${msg ? ': ' + msg : ''})`);
    e.status = r.status; throw e;
  },
  async raw(path){
    const r = await this.api('/contents/' + path + '?ref=' + encodeURIComponent(this.cfg.branch || 'main'), { headers:{ Accept:'application/vnd.github.raw+json' } });
    if (r.status === 404) return null;
    if (!r.ok) await this.fail(r, 'Download');
    return r;
  },
  async put(path, b64, sha, message){
    const body = { message, content:b64, branch:this.cfg.branch || 'main' };
    if (sha) body.sha = sha;
    const r = await this.api('/contents/' + path, { method:'PUT', body:JSON.stringify(body), headers:{ 'Content-Type':'application/json' } });
    if (!r.ok) await this.fail(r, 'Upload');
    return (await r.json()).content.sha;
  },
  async del(path, sha, message){
    const r = await this.api('/contents/' + path, { method:'DELETE', body:JSON.stringify({ message, sha, branch:this.cfg.branch || 'main' }), headers:{ 'Content-Type':'application/json' } });
    if (!r.ok && r.status !== 404) await this.fail(r, 'Delete');
  },
  /** download a photo that only exists in the repository (e.g. added on the other phone) */
  async fetchPhoto(pid){
    if (!this.enabled()) return null;
    try { const r = await this.raw(`photos/${pid}.jpg`); return r ? await r.blob() : null; } catch(e){ return null; }
  },
  /* ---- the sync itself ---- */
  async run(){
    if (!this.enabled()) return;
    if (this.running){ this.again = true; return; }
    if (!navigator.onLine){ this.setStatus('offline'); return; }
    this.running = true; this.setStatus('syncing');
    try {
      try { await this.once(); }
      catch(e){ if (e.status === 409 || e.status === 422) await this.once(); else throw e; } // someone else changed a file mid-sync: pull again, then retry
      this.state.lastSync = Date.now(); await this.saveState();
      this.setStatus('idle');
    } catch(e){
      console.warn('sync', e);
      this.setStatus(navigator.onLine ? 'error' : 'offline', e.message || String(e));
    }
    this.running = false;
    if (this.again){ this.again = false; this.run(); }
  },
  async once(){
    const st = this.state;
    // 1. what's in the repository right now
    let tree = [];
    const r = await this.api(`/git/trees/${encodeURIComponent(this.cfg.branch || 'main')}?recursive=1`);
    if (r.ok) tree = (await r.json()).tree || [];
    else if (r.status !== 404 && r.status !== 409) await this.fail(r, 'Checking for changes'); // 404/409: empty repository
    const rTrips = {}, rPhotos = {};
    for (const e of tree){
      let m;
      if ((m = e.path.match(/^trips\/([A-Za-z0-9_-]+)\.json$/))) rTrips[m[1]] = e.sha;
      else if ((m = e.path.match(/^photos\/([A-Za-z0-9_-]+)\.jpg$/))) rPhotos[m[1]] = e.sha;
    }
    const dirty = new Set(st.dirty), deleted = new Set(st.deleted);
    const local = new Map(Store.trips.map(t => [t.id, t]));
    let changed = false;
    // 2. pull trips that are new or changed on the other phone
    for (const [id, sha] of Object.entries(rTrips)){
      if (st.trips[id] === sha || deleted.has(id)) continue;
      const res = await this.raw(`trips/${id}.json`);
      if (!res) continue;
      let remote; try { remote = JSON.parse(await res.text()); } catch(e){ continue; }
      remote.id = id;
      const mine = local.get(id);
      if (mine && dirty.has(id) && (mine.updatedAt || 0) >= (remote.updatedAt || 0)){ st.trips[id] = sha; continue; } // ours is newer: push below
      await Store.putRaw(remote); dirty.delete(id); st.trips[id] = sha; changed = true;
    }
    // trips deleted on the other phone
    for (const id of Object.keys(st.trips)){
      if (rTrips[id]) continue;
      delete st.trips[id];
      if (!dirty.has(id) && local.has(id)){ await Store.removeRaw(id); changed = true; }
    }
    st.dirty = [...dirty];
    await this.saveState();
    if (changed) await Store.reload();
    // 3. push our deletions
    for (const id of [...deleted]){
      if (rTrips[id]) await this.del(`trips/${id}.json`, rTrips[id], 'Delete trip');
      delete st.trips[id]; deleted.delete(id); st.deleted = [...deleted]; await this.saveState();
    }
    // 4. push our new/edited trips (their photos first)
    for (const id of [...dirty]){
      const t = Store.trips.find(x => x.id === id);
      if (!t){ dirty.delete(id); continue; }
      for (const p of t.photos || []){
        if (!p.id || rPhotos[p.id]) continue;
        const blob = await Store.getPhotoBlob(p.id);
        if (!blob) continue;
        rPhotos[p.id] = await this.put(`photos/${p.id}.jpg`, await blobToB64(blob), null, `Add photo: ${t.title}`);
        st.photos[p.id] = true; await this.saveState();
      }
      const { id:_id, ...body } = t;
      st.trips[id] = await this.put(`trips/${id}.json`, textToB64(JSON.stringify(body, null, 1)), rTrips[id], `${rTrips[id] ? 'Update' : 'Add'} trip: ${t.title}`);
      dirty.delete(id); st.dirty = [...dirty]; await this.saveState();
    }
    // 5. photos removed from trips on this phone
    for (const pid of [...st.photoDeletes]){
      if (rPhotos[pid]) await this.del(`photos/${pid}.jpg`, rPhotos[pid], 'Remove photo');
      delete st.photos[pid]; st.photoDeletes = st.photoDeletes.filter(x => x !== pid); await this.saveState();
    }
    for (const pid of Object.keys(rPhotos)) st.photos[pid] = true;
  },
  /** first connection from this phone: check the repository, then merge */
  async connect(cfg){
    const prev = this.cfg;
    this.cfg = { owner:cfg.owner.trim().replace(/^@/, ''), repo:cfg.repo.trim(), token:cfg.token.trim() };
    try {
      const r = await this.api('');
      if (!r.ok) await this.fail(r, 'Connecting');
      const info = await r.json();
      if (!info.private) throw new Error('That repository is public, so anyone could see your trips and photos. Make it private on GitHub (its Settings → General → Danger Zone → Change visibility), then connect again.');
      this.cfg.branch = info.default_branch || 'main';
    } catch(e){ this.cfg = prev; throw e; }
    await Store.setSetting('syncConfig', this.cfg);
    this.state = this.blank();
    this.state.dirty = Store.trips.map(t => t.id); // everything on this phone gets merged in
    await this.saveState();
    await this.run();
    if (this.status === 'error') throw new Error(this.error);
  },
  async disconnect(){
    this.cfg = null; this.state = this.blank();
    await Store.setSetting('syncConfig', null); await this.saveState();
    this.setStatus('off');
  },
};
function textToB64(str){
  const bytes = new TextEncoder().encode(str); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
async function blobToB64(blob){ return (await blobToDataURL(blob)).split(',')[1]; }
function timeAgo(ms){
  const s = Math.round((Date.now() - ms) / 1000);
  if (s < 45) return 'just now';
  if (s < 3600) return Math.round(s / 60) + ' min ago';
  if (s < 86400) return Math.round(s / 3600) + ' h ago';
  return new Date(ms).toLocaleDateString();
}
function renderSyncBadge(){
  const b = $('#backupBtn'); if (!b) return;
  const st = Sync.status;
  const label = { off:'Sync', idle:'Synced', syncing:'Syncing…', offline:'Offline', error:'Sync issue' }[st] || 'Sync';
  b.dataset.state = st;
  b.setAttribute('aria-label', `${label}. Open sync and backup settings`);
  $('.lbl-long', b).textContent = label;
}

/* ================= who went: Tommy & Katherine =================
   Each trip is tagged with who went (`owners`). Places are colored by who has been there
   (purple = Tommy, green = Katherine, blue = both of you) and get darker with every trip.
   To rename the two of you, change PEOPLE (and the matching keys in HUES). */
const PEOPLE = ['Tommy', 'Katherine'];
const NONE = '__none';
const HUES = {
  both:      { label:'Both',          light:'#b1cbf1', dark:'#0f3478', pin:'#2563c9' },
  Tommy:     { label:'Tommy',         light:'#cdb6ef', dark:'#3e1475', pin:'#7b3fc4' },
  Katherine: { label:'Katherine',     light:'#acdcb7', dark:'#125326', pin:'#2e9a56' },
  [NONE]:    { label:'No one tagged', light:'#e2ded5', dark:'#565a5e', pin:'#7d8589' },
};
const Owners = {
  hidden:new Set((() => { try { return JSON.parse(lsGet('tripatlas.hiddenOwners') || '[]'); } catch(e){ return []; } })()),
  canon(n){ return PEOPLE.find(p => p.toLowerCase() === String(n || '').trim().toLowerCase()) || null; },
  /** who went on a trip (only Tommy/Katherine count; anything else is "no one tagged") */
  of(t){ return PEOPLE.filter(p => (t.owners || []).some(n => this.canon(n) === p)); },
  hasUnassigned(){ return Store.trips.some(t => !this.of(t).length); },
  buckets(){ const b = [...PEOPLE]; if (this.hasUnassigned()) b.push(NONE); return b; },
  label(n){ return HUES[n] ? HUES[n].label : n; },
  color(n){ return (HUES[n] || HUES[NONE]).pin; },
  isVisible(t){ const os = this.of(t); return os.length ? os.some(o => !this.hidden.has(o)) : !this.hidden.has(NONE); },
  /** the people on a trip who are currently shown by the filter (or [NONE]) */
  shown(t){ const os = this.of(t); return os.length ? os.filter(o => !this.hidden.has(o)) : [NONE]; },
  /** 'both' | 'Tommy' | 'Katherine' | NONE for a set of names */
  hueKey(names){ const ps = PEOPLE.filter(p => names && names.has(p)); return ps.length === 2 ? 'both' : ps.length === 1 ? ps[0] : NONE; },
  tripHue(t){ return this.hueKey(new Set(this.shown(t))); },
  tripColor(t){ return HUES[this.tripHue(t)].pin; },
  setHidden(set){ this.hidden = set; lsSet('tripatlas.hiddenOwners', JSON.stringify([...set])); },
  filtering(){ return this.buckets().some(b => this.hidden.has(b)); },
};
const tint = (c, k) => d3.interpolateRgb(c, '#ffffff')(k);
/** Heat-map color: the hue says who has been there, the shade says how many trips (1 … 5+). */
const HEAT_STEPS = 5;
function heatColor(hue, count, muted){
  const k = (Math.min(Math.max(count, 1), HEAT_STEPS) - 1) / (HEAT_STEPS - 1);
  const c = d3.interpolateLab(HUES[hue].light, HUES[hue].dark)(k);
  return muted ? d3.interpolateRgb(c, '#efe9dc')(0.55) : c;
}
/** Fill for a place key ('c-040', 's-49'), or null if no shown trips went there. */
function paintPlace(key, muted){
  const trips = IDX.byPlace.get(key);
  if (!trips || !trips.size) return null;
  return heatColor(Owners.hueKey(IDX.ownersAt.get(key)), trips.size, muted);
}
/** Map key: one shade ramp per color that can appear with the current filter. */
function addHeatLegend(stage){
  if (!IDX.trips.length) return;
  const vis = PEOPLE.filter(p => !Owners.hidden.has(p));
  const rows = [];
  if (vis.length === 2) rows.push('both');
  rows.push(...vis);
  if (Owners.hasUnassigned() && !Owners.hidden.has(NONE)) rows.push(NONE);
  if (!rows.length) return;
  const ramp = h => `linear-gradient(90deg,${d3.range(1, HEAT_STEPS + 1).map(n => heatColor(h, n)).join(',')})`;
  const el = document.createElement('div');
  el.className = 'heatlegend'; el.setAttribute('role', 'note'); el.setAttribute('aria-label', 'Map key: colors show who went, darker means more trips');
  el.innerHTML = rows.map(h => `<span class="hk-name">${esc(HUES[h].label)}</span><i class="hk-ramp" style="background:${ramp(h)}"></i>`).join('') +
    `<span></span><span class="hk-scale"><span>1 trip</span><span>${HEAT_STEPS}+</span></span>`;
  stage.appendChild(el);
}

/* ================= trip indexing ================= */
const IDX = { trips:[], visitedCountries:new Set(), visitedStates:new Set(), byPlace:new Map(), ownersAt:new Map() };
function reindex(){
  IDX.trips = Store.trips.filter(t => Owners.isVisible(t));
  IDX.visitedCountries = new Set(); IDX.visitedStates = new Set(); IDX.byPlace = new Map(); IDX.ownersAt = new Map();
  const add = (k, t) => {
    if (!IDX.byPlace.has(k)) { IDX.byPlace.set(k, new Set()); IDX.ownersAt.set(k, new Set()); }
    IDX.byPlace.get(k).add(t);
    for (const o of Owners.shown(t)) IDX.ownersAt.get(k).add(o);
  };
  for (const t of IDX.trips){
    for (const d of t.destinations || []){
      if (d.country){ IDX.visitedCountries.add(d.country); add(d.country, t);
        const f = G.byKey.get(d.country); if (f) add('k-' + f.cont, t); }
      if (d.state){ IDX.visitedStates.add(d.state); add('s-' + d.state, t); }
    }
  }
}
const ownersAt = (k) => IDX.ownersAt.get(k);
const tripsAt = (k) => sortTrips([...(IDX.byPlace.get(k) || [])]);
function sortTrips(arr){ return arr.slice().sort((a, b) => (b.startDate || '').localeCompare(a.startDate || '') || (b.updatedAt || 0) - (a.updatedAt || 0)); }
function tripPlaces(t){
  const names = [];
  for (const d of t.destinations || []){ const n = d.stateName ? d.stateName : d.countryName; if (n && !names.includes(n)) names.push(n); }
  return names;
}
function tripPlaceList(t){
  const out = [];
  for (const d of t.destinations || []){
    const p = d.state ? { n:d.stateName, h:'state-' + d.state } : d.country ? { n:d.countryName, h:'country-' + d.country.slice(2) } : null;
    if (p && p.n && !out.some(x => x.h === p.h)) out.push(p);
  }
  return out;
}
function routeText(t){ return (t.destinations || []).map(d => d.name).join(' → '); }

/* ================= routing ================= */
let cleanup = [];
function runCleanup(){ cleanup.forEach(f => { try{f();}catch(e){} }); cleanup = []; }
function parseRoute(){
  const h = location.hash.replace(/^#/, '');
  let m;
  if (!h || h === 'world') return { view:'world' };
  if ((m = h.match(/^continent-(.+)$/)) && CONTINENTS[m[1]]) return { view:'continent', id:m[1] };
  if ((m = h.match(/^country-(.+)$/))) return { view:'place', kind:'country', id:'c-' + m[1] };
  if ((m = h.match(/^state-(\d+)$/))) return { view:'place', kind:'state', id:m[1] };
  if ((m = h.match(/^trip-([A-Za-z0-9_-]+)$/))) return { view:'trip', id:m[1] };
  if (h === 'new') return { view:'form' };
  if ((m = h.match(/^edit-([A-Za-z0-9_-]+)$/))) return { view:'form', id:m[1] };
  return { view:'world' };
}
const go = (h) => { if (location.hash === '#' + h) render(); else location.hash = h; };
let lastRouteKey = '';
let formDirty = false;
function render(force){
  const r = parseRoute();
  const key = JSON.stringify(r);
  // Don't blow away a form someone is filling in when trips update in the background.
  if (!force && key === lastRouteKey && r.view === 'form') return;
  if (key !== lastRouteKey) window.scrollTo(0, 0);
  lastRouteKey = key;
  runCleanup();
  updateStats();
  renderOwnerBar(r.view);
  const layout = $('#layout'), panel = $('#panel'), stage = $('#stage');
  layout.classList.toggle('page-mode', r.view === 'trip' || r.view === 'form');
  panel.style.display = (r.view === 'trip' || r.view === 'form') ? 'none' : '';
  stage.className = 'stage';
  stage.classList.toggle('full', r.view === 'trip' || r.view === 'form');
  stage.removeAttribute('aria-label');
  stage.innerHTML = ''; panel.innerHTML = '';
  if (!G.ready){ stage.innerHTML = '<div class="loading">Loading the map…</div>'; return; }
  if (r.view === 'world') return viewWorld(panel, stage);
  if (r.view === 'continent') return viewContinent(r.id, panel, stage);
  if (r.view === 'place') return viewPlace(r.kind, r.id, panel, stage);
  if (r.view === 'trip') return viewTrip(r.id, stage);
  if (r.view === 'form') return viewForm(r.id, stage);
}
function setCrumbs(items){
  const el = $('#crumbs');

    const last = i === items.length - 1;
    return (i ? '<span class="sep" aria-hidden="true">›</span>' : '') + (last || !it.h ? `<span class="cur" ${last ? 'aria-current="page"' : ''}>${esc(it.t)}</span>` : `<a href="#${it.h}">${esc(it.t)}</a>`);

}
function updateStats(){
  const el = $('#stats');
  const nC = IDX.visitedCountries.size, nS = IDX.visitedStates.size, nT = IDX.trips.length;
  el.innerHTML = `<span><b>${nT}</b> trip${nT===1?'':'s'}</span><span><b>${nC}</b> countr${nC===1?'y':'ies'}</span>${nS ? `<span><b>${nS}</b> US state${nS===1?'':'s'}</span>` : ''}`;
}
/* ---------- "who went" filter bar (on every page except the form) ---------- */
function renderOwnerBar(view){
  const el = $('#ownerbar');

    (Owners.filtering() ? `<button class="btn sm ghost" data-showall>Show everyone</button>` : '');

function applyOwnerFilter(set){ Owners.setHidden(set); reindex(); render(true); }
document.addEventListener('click', e => {

});
